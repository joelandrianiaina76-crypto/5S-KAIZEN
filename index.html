<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<title>5S &amp; Kaizen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --steel-900:#0f172a;
    --steel-800:#1e293b;
    --steel-700:#334155;
    --steel-600:#64748b;
    --paper:#f1f5f9;
    --paper-card:#ffffff;
    --line:#e2e8f0;
    --line-strong:#cbd5e1;
    --amber:#2563eb;
    --amber-dark:#1d4ed8;
    --ink:#0f172a;
    --ink-soft:#64748b;
    --red:#dc2626;
    --yellow:#d97706;
    --lgreen:#65a30d;
    --green:#16a34a;
    --blue:#2563eb;
    --radius:12px;
    --shadow-sm:0 1px 2px rgba(15,23,42,.05);
    --shadow-md:0 4px 16px rgba(15,23,42,.07);
    --shadow-lg:0 12px 32px rgba(15,23,42,.12);
    --font:Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-display:"Plus Jakarta Sans", Inter, system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font);
    font-size:14px;
    line-height:1.5;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }
  h1,h2,h3,h4{
    font-family:var(--font-display);
    text-transform:none;
    letter-spacing:-0.02em;
    margin:0;
    font-weight:700;
    color:var(--ink);
  }
  .mono{font-family:var(--font);font-variant-numeric:tabular-nums;}
  a{color:inherit;text-decoration:none;}
  button{font-family:var(--font);cursor:pointer;}

  /* ---- Header / Nav ---- */
  header.top{
    background:linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
    color:#f8fafc;
    padding:12px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
    border-bottom:1px solid rgba(255,255,255,.08);
    box-shadow:0 4px 24px rgba(15,23,42,.25);
    position:sticky;top:0;z-index:50;
  }
  .brand{display:flex;align-items:center;gap:14px;}
  .brand .tag{
    width:44px;height:44px;border-radius:10px;background:#fff;
    display:flex;align-items:center;justify-content:center;
    padding:5px;box-shadow:0 0 0 2px rgba(37,99,235,.45), 0 4px 12px rgba(0,0,0,.2);
  }
  .brand .tag img{width:100%;height:100%;object-fit:contain;}
  .brand h1{font-size:18px;color:#fff;font-weight:700;letter-spacing:-0.01em;}
  .brand small{display:block;font-family:var(--font);font-size:11px;color:#94a3b8;letter-spacing:.04em;text-transform:none;font-weight:500;margin-top:2px;}
  nav.tabs{display:flex;gap:6px;flex-wrap:wrap;}
  nav.tabs button,.factory-switcher button{touch-action:manipulation;}
  .tabs button{
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);color:#cbd5e1;
    padding:8px 14px;font-size:12px;letter-spacing:.03em;text-transform:uppercase;
    border-radius:8px;font-weight:600;transition:none;
  }
  nav.tabs button.active{background:var(--amber);border-color:var(--amber);color:#fff;font-weight:700;box-shadow:0 2px 8px rgba(37,99,235,.4);}
  nav.tabs button:hover:not(.active){border-color:rgba(255,255,255,.25);color:#fff;background:rgba(255,255,255,.08);}
  .factory-switcher{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex-shrink:1;min-width:0;max-width:100%;}
  .factory-switcher .factory-label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#94a3b8;margin-right:4px;font-weight:600;}
  .factory-switcher button{
    background:rgba(255,255,255,.95);border:1px solid transparent;color:var(--steel-900);
    padding:7px 12px;font-size:12px;font-weight:700;border-radius:8px;letter-spacing:.02em;
    transition:none;
  }
  
  .factory-switcher button.btn-regional{
    background:#FFBF00;border:1px solid #FFBF00;color:#000;font-weight:800;margin-left:4px;
  }
  .factory-switcher button.btn-regional:hover:not(.active){
    background:#ffc933;border-color:#e6ac00;color:#000;
  }
  .factory-switcher button.btn-regional.active{
    background:var(--blue,#2563eb);border-color:var(--blue,#2563eb);color:#fff;
    box-shadow:0 2px 8px rgba(37,99,235,.35);
  }
  .regional-page{display:flex;flex-direction:column;gap:20px;}
  .regional-table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:var(--shadow-sm);border:1px solid var(--line);}
  .regional-table th,.regional-table td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;}
  .regional-table th{background:#f8fafc;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#64748b;font-weight:700;}
  .regional-table tr:last-child td{border-bottom:none;}
  .regional-table .rank-badge{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:28px;height:28px;border-radius:999px;background:#0f172a;color:#fff;font-weight:800;font-size:12px;
  }
  .regional-table .rank-1{background:#16a34a;}
  .regional-table .rank-2{background:#2563eb;}
  .regional-table .rank-3{background:#d97706;}
  .regional-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;}
  @media(max-width:900px){.regional-cards{grid-template-columns:repeat(2,minmax(0,1fr));}}
  @media(max-width:520px){.regional-cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}}
  .regional-factory-card{
    background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;
    box-shadow:var(--shadow-sm);
  }
  
  .regional-bar-wrap{
    display:flex;align-items:center;gap:10px;width:100%;min-width:0;margin-top:8px;
  }
  .regional-bar-track{
    flex:1 1 auto;height:12px;background:#e2e8f0;border-radius:0;overflow:hidden;
    min-width:calc(60px + 6mm);width:100%;
  }
  .regional-bar-fill{
    height:100%;background:#2563eb;border-radius:0;width:0%;
  }
  .regional-bar-fill.train{background:#00CC99;border-radius:0;}

  .regional-bar-val{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:4.5em;}
  td .regional-bar-wrap{margin-top:0;}

  .regional-factory-card h4{margin:0 0 8px;font-size:15px;font-weight:800;}
  .regional-factory-card .rf-rating{font-size:28px;font-weight:800;font-family:var(--font-display);letter-spacing:-0.02em;}
  .regional-factory-card .rf-meta{font-size:12px;color:var(--ink-soft);margin-top:6px;line-height:1.4;}
  .regional-bw{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:720px){.regional-bw{grid-template-columns:1fr;}}

  .factory-switcher button.active{background:var(--amber);border-color:var(--amber);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.35);}
  .factory-switcher button:hover:not(.active){border-color:var(--amber);color:var(--amber-dark);}

  main{width:100%;max-width:1760px;margin:0 auto;padding:24px 20px 90px;box-sizing:border-box;min-height:50vh;}

  .eyebrow{
    font-family:var(--font);font-size:11px;letter-spacing:.12em;color:var(--amber);
    text-transform:uppercase;margin-bottom:6px;font-weight:600;
  }
  .pagehead{
    display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px;
    margin-bottom:24px;border-bottom:1px solid var(--line);padding-bottom:16px;
  }
  .pagehead h2{font-size:26px;font-weight:800;letter-spacing:-0.03em;}

  .stat-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:0;}
  @media(max-width:1100px){.stat-row{grid-template-columns:repeat(2,minmax(0,1fr));}}
  @media(max-width:560px){.stat-row{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}}

  .overview-panel{
    background:#fff;border:1px solid #e8eef5;border-radius:20px;
    padding:22px 22px 18px;margin-bottom:28px;
    box-shadow:0 10px 40px rgba(15,23,42,.04);
    position:relative;overflow:hidden;
  }
  .overview-panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px;}
  .overview-panel-head .ov-title-wrap{display:flex;align-items:flex-start;gap:12px;}
  .overview-panel-head .ov-bar{width:4px;height:36px;border-radius:4px;background:linear-gradient(180deg,#3b82f6,#2563eb);flex:0 0 auto;margin-top:2px;}
  .overview-panel-head h2{margin:0;font-size:18px;font-weight:800;letter-spacing:.02em;color:#0f172a;text-transform:uppercase;}
  .overview-panel-head .ov-sub{margin:4px 0 0;font-size:12.5px;color:#94a3b8;font-weight:500;}
  .overview-dots{display:grid;grid-template-columns:repeat(4,6px);gap:4px;opacity:.55;}
  .overview-dots span{width:6px;height:6px;border-radius:50%;background:#93c5fd;}
  .overview-tip{
    margin-top:16px;padding:12px 14px;border-radius:12px;background:#f8fafc;border:1px solid #eef2f7;
    display:flex;align-items:center;gap:10px;font-size:12.5px;color:#64748b;line-height:1.4;
  }
  .overview-tip .tip-ico{
    width:22px;height:22px;border-radius:50%;background:#e0f2fe;color:#0284c7;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:0 0 auto;
  }

  .stat-card{
    background:#fff;color:var(--ink);
    padding:18px 18px 16px;border-radius:16px;
    border:1px solid #eef2f7;
    box-shadow:0 8px 24px rgba(15,23,42,.04);
    position:relative;overflow:hidden;
    min-height:132px;
    display:flex;flex-direction:column;align-items:flex-start;
  }
  .stat-card::before{display:none;}
  .stat-card::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:0 0 16px 16px;
    background:var(--card-accent,#3b82f6);
  }
  .stat-card .stat-ico{
    width:42px;height:42px;border-radius:0;display:flex;align-items:center;justify-content:center;
    font-size:26px;margin-bottom:10px;color:var(--card-accent,#3b82f6);flex:0 0 auto;
    background:transparent;
    box-shadow:none;
    line-height:1;
  }
  .stat-card .num{font-family:var(--font-display);font-size:28px;font-weight:800;line-height:1.1;letter-spacing:-0.02em;color:var(--card-accent,#0f172a);}
  .stat-card .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:#64748b;margin-top:10px;font-weight:600;line-height:1.35;}
  .stat-card.alt{background:#fff;color:var(--ink);border:1px solid #eef2f7;box-shadow:0 8px 24px rgba(15,23,42,.04);}
  .stat-card.alt::before{display:none;}
  .stat-card.alt .lbl{color:#64748b;}
  .stat-card.hero{
    background:linear-gradient(145deg,#0b1220 0%,#1e293b 100%);color:#fff;
    border:1px solid rgba(255,255,255,.06);
    box-shadow:0 12px 28px rgba(15,23,42,.22);
  }
  .stat-card.hero .num{color:#fff;}
  .stat-card.avg-rating-card{
    min-height:120px;padding:18px 20px;
  }
  .stat-card.avg-rating-card::before,
  .stat-card.avg-rating-card::after{display:none !important;}
  .avg-card-main{
    display:flex;align-items:flex-start;justify-content:space-between;gap:16px;width:100%;
  }
  .avg-card-left{flex:1 1 auto;min-width:0;}
  .avg-card-right{
    flex:0 0 auto;max-width:48%;text-align:right;font-size:11px;font-weight:600;line-height:1.35;
  }
  .avg-card-right .avg-date{font-size:11px;font-weight:700;letter-spacing:.02em;}
  .avg-card-right .avg-sub{margin-top:4px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;opacity:.85;}
  .stat-card.avg-rating-card .num{font-size:84px;line-height:1;letter-spacing:-0.03em;font-weight:800;}
  .stat-card.avg-rating-card .num span{font-size:28px !important;font-weight:700;}
  .stat-card.avg-rating-card{min-height:160px;padding:20px 22px;}
  .avg-remark-bar{
    margin-top:14px;padding-top:10px;border-top:1px solid rgba(15,23,42,.12);
    font-size:14px;font-weight:700;line-height:1.35;
    width:100%;min-height:1.4em;white-space:normal;
  }
  .stat-card.avg-rating-card{
    display:flex;flex-direction:column;justify-content:space-between;
  }
  .hbar-remark{
    font-size:10.5px;font-weight:600;line-height:1.25;color:var(--ink-soft);
    white-space:normal;max-width:140px;
  }
  .hbar-metric-with-remark{display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:0;}

  .stat-card.hero .lbl{color:#94a3b8;}
  .stat-card.hero .stat-ico{background:transparent;box-shadow:none;color:#2563eb;}
  .stat-card.hero::after{background:linear-gradient(90deg,#2563eb,#60a5fa);}
  .stat-card.tone-red{--card-accent:#ef4444;}
  .stat-card.tone-green{--card-accent:#22c55e;}
  .stat-card.tone-blue{--card-accent:#3b82f6;}
  .stat-card.tone-indigo{--card-accent:#4f46e5;}
  .stat-card.tone-purple{--card-accent:#8b5cf6;}
  .stat-card.tone-cyan{--card-accent:#06b6d4;}
  .stat-card.tone-orange{--card-accent:#f97316;}

  /* department floor-tag card */
  .plate{
    background:var(--paper-card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;position:relative;cursor:pointer;
    transition:none;
    box-shadow:var(--shadow-sm);
  }
  .plate:hover{box-shadow:var(--shadow-md);border-color:var(--line-strong);}
  .plate::before,.plate::after{display:none;}
  .plate .dname{font-family:var(--font-display);font-size:14px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;font-weight:700;}
  .plate .champ{font-size:12px;color:var(--ink-soft);margin-bottom:12px;}
  .plate .champ b{color:var(--ink);font-weight:600;}
  .barwrap{height:64px;background:#f8fafc;border:1px solid var(--line);border-radius:8px;display:flex;align-items:flex-end;padding:3px;position:relative;}
  .bar{width:100%;border-radius:4px;transition:none;}
  .plate .ratingnum{
    position:absolute;top:10px;right:12px;font-family:var(--font-display);font-weight:700;font-size:15px;
    background:rgba(255,255,255,.92);padding:2px 8px;border-radius:6px;border:1px solid var(--line);
  }

  .grid-depts{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;}

  /* Horizontal bar list */
  .hbar-list{
    background:var(--paper-card);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;box-shadow:var(--shadow-sm);
  }
  .hbar-row{
    display:grid;grid-template-columns:minmax(90px,0.95fr) minmax(140px,1.25fr) minmax(110px,1fr) minmax(120px,0.9fr);
    gap:8px;align-items:center;
    padding:6px 10px;border-bottom:1px solid var(--line);cursor:pointer;transition:none;
  }
  .hbar-row:last-child{border-bottom:none;}
  .hbar-row:hover{background:#f8fafc;}
  .hbar-name{
    font-family:var(--font-display);text-transform:uppercase;font-size:12.5px;letter-spacing:.04em;
    color:var(--ink);white-space:normal;overflow:visible;text-overflow:clip;font-weight:600;line-height:1.25;
  }
  .hbar-track{
    background:#f1f5f9;border:1px solid var(--line);border-radius:4px;height:20px;
    position:relative;overflow:hidden;width:100%;max-width:100%;flex:1 1 auto;min-width:48px;
  }
  .hbar-fill{height:100%;transition:none;border-radius:3px;}
  .hbar-value{font-family:var(--font);font-weight:700;font-size:13px;min-width:30px;text-align:right;font-variant-numeric:tabular-nums;}
  .hbar-training{font-family:var(--font);font-weight:600;font-size:12px;min-width:32px;text-align:right;color:var(--blue);}
  .hbar-metric{display:flex;align-items:center;gap:6px;min-width:0;width:100%;}
  .hbar-champ{font-size:12px;color:var(--ink-soft);white-space:normal;overflow:visible;text-overflow:clip;display:flex;align-items:center;gap:6px;min-width:0;}
  .hbar-champ-avatar{
    width:24px;height:24px;border-radius:6px;flex:0 0 24px;overflow:hidden;
    background:linear-gradient(145deg,#1e293b,#0f172a);border:1.5px solid var(--amber);
    display:flex;align-items:center;justify-content:center;
  }
  .hbar-champ-avatar img{width:100%;height:100%;object-fit:cover;object-position:center center;display:block;}
  .hbar-champ-avatar .hbar-av-fb{color:#94a3b8;font-size:10px;font-weight:700;letter-spacing:0;text-transform:uppercase;}
  .hbar-champ-name{overflow:visible;text-overflow:clip;white-space:normal;min-width:0;line-height:1.25;word-break:break-word;}
  .hbar-header{
    display:grid;grid-template-columns:minmax(90px,0.95fr) minmax(140px,1.25fr) minmax(110px,1fr) minmax(120px,0.9fr);gap:8px;align-items:center;
    margin:0;padding:7px 10px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;
    color:#475569;border:none;border-bottom:1px solid var(--line);border-radius:0;font-weight:700;
    background:#f8fafc;
    box-shadow:0 2px 8px rgba(15,23,42,.04);
    width:100%;
    box-sizing:border-box;
  }
  .hbar-header > span{
    overflow:visible;text-overflow:clip;white-space:nowrap;min-width:0;
    display:block;padding:0;border:none;background:transparent;box-shadow:none;border-radius:0;
    color:#64748b;font-weight:700;font-size:10px;letter-spacing:.07em;
  }
  .hbar-header > span:last-child{
    white-space:nowrap;overflow:visible;letter-spacing:.04em;
  }
  @media(max-width:900px){
    .hbar-row,.hbar-header{grid-template-columns:minmax(80px,0.9fr) minmax(110px,1.2fr) minmax(90px,1fr) minmax(110px,0.9fr);gap:6px;}
    .hbar-track{width:100%;flex-basis:auto;}
  }
  @media(max-width:640px){
    .hbar-row,.hbar-header{grid-template-columns:minmax(65px,0.9fr) minmax(95px,1.2fr) minmax(80px,1fr) minmax(100px,0.9fr);gap:5px;}
    .hbar-track{width:100%;flex:1 1 auto;}
    .hbar-metric{gap:4px;}
    .hbar-name,.hbar-champ{font-size:11px;}
  }

  body{background:linear-gradient(180deg,#f8fafc 0%, #f1f5f9 180px, #f1f5f9 100%);}
  section.block{margin-bottom:36px;}
  .blocktitle{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .blocktitle h3{font-size:15px;color:var(--ink);font-weight:700;letter-spacing:-0.01em;}
  .blocktitle .count{
    font-family:var(--font);background:var(--steel-900);color:#fff;font-size:11px;
    padding:3px 9px;border-radius:999px;font-weight:600;
  }
  .collapse-btn{
    margin-left:auto;background:transparent;border:none;color:var(--ink-soft);
    cursor:pointer;font-size:13px;padding:6px 10px;line-height:1;border-radius:8px;font-weight:500;
  }
  .collapse-btn:hover{color:var(--ink);background:rgba(15,23,42,.05);}

  .plate,.hbar-list,.admin-panel,.photo-card,.share-post,.kaizen-table,.stat-card.alt,.bw-item,.kz-info,.ba-point{
    box-shadow:var(--shadow-sm);
  }

  .home5s-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"ratingtrends bestof" "waste wastetrend";gap:20px;align-items:stretch;width:100%;box-sizing:border-box;}
  .home5s-grid .area-deptr{grid-area:deptr;}
  .home5s-grid .area-officer{grid-area:officer;}
  .home5s-grid .area-waste{grid-area:waste;display:flex;flex-direction:column;}
  .area-wastetrend{grid-area:wastetrend;display:flex;flex-direction:column;}
  .rating-trends-box{
    grid-area:ratingtrends;background:var(--paper-card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 20px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:16px;
  }
  .rating-trends-box .trend-panel + .trend-panel{border-top:1px solid var(--line);padding-top:14px;}
  .trend-panel .blocktitle{margin-bottom:8px;}
  .trend-panel.dark, .area-wastetrend.home-frame{
    background:#0b1f33;border:1px solid #143049;color:#e2e8f0;box-shadow:0 8px 28px rgba(2,8,20,.28);
  }
  .trend-panel.dark .blocktitle h3, .area-wastetrend .blocktitle h3{color:#3b82f6;}
  .trend-chart-wrap{width:100%;overflow:hidden;}
  .trend-chart-wrap svg{width:100%;height:140px;display:block;}
  .trend-meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--ink-soft);margin-top:6px;}
  .trend-panel.dark .trend-meta, .area-wastetrend .trend-meta{color:#94a3b8;}
  .home5s-page{
    position:relative;
    width:100%;
    max-width:100%;

  /* ---- Page & results animations ---- */
  @keyframes pageEnter {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes softPop {
    0% { opacity: 0; transform: scale(0.92); }
    70% { transform: scale(1.02); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes countFlash {
    0% { opacity: 0.35; }
    100% { opacity: 1; }
  }
  #main > .page-anim-enter,
  #admin-panel-host.page-anim-enter {
    animation: pageEnter 0.42s cubic-bezier(0.22, 1, 0.36, 1) both;

  .anim-num {

     FINAL RESPONSIVE POLISH — fluid sizing + minimized blank space
     for tablets & smartphones
     ============================================================ */
  html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }

  /* Fluid text: scales continuously with viewport instead of jumping
     only at fixed breakpoints. */
  .brand h1{ font-size:clamp(14px, 3.6vw, 18px) !important; }
  .brand small{ font-size:clamp(9px, 2.4vw, 11px) !important; }
  .pagehead h2{ font-size:clamp(17px, 5vw, 26px) !important; }
  .eyebrow{ font-size:clamp(9px, 2.2vw, 11px) !important; }
  .overview-panel-head h2{ font-size:clamp(13px, 3.2vw, 18px) !important; }
  .overview-panel-head .ov-sub{ font-size:clamp(10px, 2.6vw, 12.5px) !important; }
  .stat-card .num{ font-size:clamp(17px, 5vw, 28px) !important; }
  .stat-card .lbl{ font-size:clamp(8.5px, 2.2vw, 10.5px) !important; }
  nav.tabs button, .tabs button,
  .factory-switcher button{ font-size:clamp(9.5px, 2.4vw, 12px) !important; }

  /* Minimize dead vertical space between sections/cards on small screens */
  @media (max-width:900px){
    section.block{ margin-bottom:18px !important; }
    .blocktitle{ margin-bottom:8px !important; }
    .pagehead{ margin-bottom:12px !important; padding-bottom:8px !important; }
    .overview-panel{ margin-bottom:12px !important; }
    .overview-tip{ margin-top:10px !important; padding:8px 10px !important; }
    main{ padding-top:10px !important; }
    h1,h2,h3,h4{ margin-bottom:6px; }
  }
  @media (max-width:480px){
    section.block{ margin-bottom:14px !important; }
    .blocktitle{ margin-bottom:6px !important; }
    .pagehead{ margin-bottom:10px !important; padding-bottom:6px !important; }
    .overview-panel{ padding:10px 10px 8px !important; margin-bottom:10px !important; }
    main{ padding-top:8px !important; padding-bottom:64px !important; }

    /* Shrink chart/canvas containers so they don't leave large empty
       areas on small phones while still being usable */
    .area-waste .waste-chart-full{ min-height:220px !important; }
    .org-modal.org-modal-zoning .floor3d-stage{ min-height:340px !important; padding:8px 2px 16px !important; }
    .org-modal.org-modal-zoning .floor3d-world{ height:320px !important; }
    .crop-stage{ height:240px !important; }
    .video-player-modal{ min-height:320px !important; }
  }

  /* Guard against any element wider than the viewport causing side-scroll */
  img, video, svg, canvas, table, iframe{ max-width:100%; }
  .regional-table-scroll, .admin-panel, .doc-word-html{ -webkit-overflow-scrolling:touch; }

</style>

async function storGet(key, shared){
  try{
    if(window.storage && typeof window.storage.get === "function"){
      var r = await window.storage.get(key, !!shared);
      return r ? r.value : null;
    }
    return localStorage.getItem("5s:"+key);
  }catch(e){ return null; }
}
async function storSet(key, value, shared){
  try{
    if(window.storage && typeof window.storage.set === "function"){
      await window.storage.set(key, value, !!shared);
      return true;
    }
    localStorage.setItem("5s:"+key, value);
    return true;
  }catch(e){
    console.error("storage set failed", key, e);
    var msg = (e && e.name === "QuotaExceededError")
      ? "Storage is full. Remove large photos/videos or use smaller images, then try again."
      : ("Save failed: " + (e && e.message || e));
    try{ alert(msg); }catch(_e){}
    return false;
  }
}

function todayStr(){
  var d = new Date();
  return isoDate(d);
}
function isoDate(d){
  var y=d.getFullYear(), m=("0"+(d.getMonth()+1)).slice(-2), day=("0"+d.getDate()).slice(-2);
  return y+"-"+m+"-"+day;
}
function isWeekend(dateStr){
  var d = new Date(dateStr+"T00:00:00");
  var wd = d.getDay(); // 0 sun 6 sat
  return wd===0 || wd===6;
}
function addDays(dateStr, n){
  var d = new Date(dateStr+"T00:00:00");
  d.setDate(d.getDate()+n);
  return isoDate(d);
}

async function saveAllData(){
  var results = [];
  async function step(name, fn){
    try{
      var ok = await fn();
      results.push({ name: name, ok: ok !== false });
    }catch(e){
      console.error("saveAll failed", name, e);
      results.push({ name: name, ok: false, error: String(e && e.message || e) });
    }
  }
  await step("config", saveConfig);
  await step("ratings", saveRatings);
  await step("officeRatings", saveOfficeRatings);
  await step("kaizens", saveKaizens);
  await step("awareness", saveAwareness);
  await step("shares", saveShares);
  await step("kaizenShares", saveKaizenShares);
  await step("improvements", saveImprovements);
  await step("beyondBoundaries", saveBeyondBoundaries);
  await step("waste", saveWaste);
  await step("bestOfMonth", saveBestOfMonth);
  await step("orgChart", saveOrgChart);
  await step("zoneLayout", saveZoneLayout);
  await step("floorPlan", saveFloorPlan);
  await step("liveAudit", saveLiveAudit);
  await step("tools", saveTools);
  await step("videoLibrary", saveVideoLibrary);
  await step("myNotes", saveMyNotes);
  await step("outlookConfig", saveOutlookConfig);
  await step("admins", saveAdmins);

  // Department / office detail caches
  var deptIds = Object.keys(state.deptDetailCache||{});
  for(var i=0;i<deptIds.length;i++){
    await step("deptDetail:"+deptIds[i], function(id){ return function(){ return saveDeptDetail(id); }; }(deptIds[i]));
  }
  var officeIds = Object.keys(state.officeDeptDetailCache||{});
  for(var j=0;j<officeIds.length;j++){
    await step("officeDetail:"+officeIds[j], function(id){ return function(){ return saveOfficeDeptDetail ? saveOfficeDeptDetail(id) : saveDeptDetail(id); }; }(officeIds[j]));
  }

  // Also persist every known department detail from config (load then save)
  var allDepts = (state.config.departments||[]).concat(state.config.officeDepartments||[]);
  for(var k=0;k<allDepts.length;k++){
    var dep = allDepts[k];
    if(!dep || !dep.id) continue;
    try{
      await loadDeptDetail(dep.id);
      await saveDeptDetail(dep.id);
      results.push({ name: "dept:"+dep.id, ok: true });
    }catch(e){
      results.push({ name: "dept:"+dep.id, ok: false, error: String(e && e.message || e) });
    }
  }

  var failed = results.filter(function(r){ return !r.ok; });
  return { ok: failed.length===0, results: results, failed: failed };
}

function mondayOf(dateStr){

  var day = d.getDay(); // 0 sun..6 sat
  var diff = (day===0? -6 : 1-day);
  d.setDate(d.getDate()+diff);
  return isoDate(d);
}

  ["fabric","Fabric"],["plastic","Plastic"],["oil","Oil"],["metal","Metal"],

];

   RATING LOGIC
============================================================ */
// find the effective rating for a department as of (on or before) a given date,
// carrying forward the last entered value (skips weekends automatically since
// no entries exist for them).
function effectiveRating(deptId, dateStr, maxLookback, ratingsObj){
  // Short lookback — long scans made 5S Dashboard lag on every click
  maxLookback = (maxLookback == null || maxLookback === undefined) ? 60 : maxLookback;
  ratingsObj = ratingsObj || state.ratings;
  var d = dateStr;
  for(var i=0;i<maxLookback;i++){
    var dayRatings = ratingsObj[d];
    if(dayRatings && typeof dayRatings[deptId] === "number"){
      return dayRatings[deptId];
    }
    d = addDays(d,-1);
  }
  return null;
}

function previousWeekday(dateStr){
  var d = addDays(dateStr, -1);
  var guard = 0;
  while(isWeekend(d) && guard < 10){ d = addDays(d, -1); guard++; }
  return d;
}
/**
 * Materialize missing weekday ratings by copying from the previous weekday.
 * Does not overwrite existing numbers. Training stays on department config (always shown until modified).
 */
function ensureRatingsCarriedForward(ratingsObj, deptsList, throughDate){
  ratingsObj = ratingsObj || state.ratings;
  deptsList = deptsList || state.config.departments || [];
  throughDate = throughDate || todayStr();
  // Only forward-fill from the latest existing rating day to today (fast).
  var keys = Object.keys(ratingsObj||{}).sort();
  if(!keys.length) return false;
  var start = keys[keys.length - 1];
  var minStart = addDays(throughDate, -120);
  if(start < minStart) start = minStart;
  var d = start, guard = 0, changed = false;
  while(d <= throughDate && guard < 200){
    guard++;
    if(!isWeekend(d)){
      if(!ratingsObj[d]) ratingsObj[d] = {};
      var prev = previousWeekday(d);
      var prevDay = ratingsObj[prev] || {};
      for(var i=0;i<deptsList.length;i++){
        var dep = deptsList[i];
        if(typeof ratingsObj[d][dep.id] !== "number" && typeof prevDay[dep.id] === "number"){
          ratingsObj[d][dep.id] = prevDay[dep.id];
          changed = true;
        }
      }
    }
    d = addDays(d, 1);
  }
  return changed;
}

function monthKeysBack(n, fromYm){
  var parts = (fromYm || todayStr().slice(0,7)).split("-");
  var y = parseInt(parts[0],10), m = parseInt(parts[1],10);
  var out = [];
  for(var i=n-1;i>=0;i--){
    var mm = m - i, yy = y;
    while(mm <= 0){ mm += 12; yy -= 1; }
    out.push(yy + "-" + ("0"+mm).slice(-2));
  }
  return out;
}
function monthBounds(ym){
  var start = ym + "-01";
  var d = new Date(start+"T00:00:00");
  var last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  return { start: start, end: ym + "-" + ("0"+last).slice(-2) };
}
function monthlyRatingSeries(deptsList, ratingsObj, months){
  return months.map(function(ym){
    var b = monthBounds(ym);
    var v = factoryAverageRange(b.start, b.end, deptsList, ratingsObj);
    return { ym: ym, label: monthLabel(ym).split(" ")[0].slice(0,3) + " " + ym.slice(2), value: v };
  });
}
function monthlyWasteSeries(months){
  return months.map(function(ym){
    var b = monthBounds(ym);
    var total = 0, weeks = 0;
    // sum all week starts that fall in this month
    Object.keys(state.waste || {}).forEach(function(wk){
      if(wk >= b.start && wk <= b.end){
        total += wasteTotalForWeek(wk);
        weeks++;
      }
    });
    return { ym: ym, label: monthLabel(ym).split(" ")[0].slice(0,3) + " " + ym.slice(2), value: weeks ? total : null, total: total };
  });
}
function renderTrendSvg(series, opts){
  opts = opts || {};
  var w = 560, h = 140, padL = 28, padR = 12, padT = 16, padB = 28;
  var vals = series.map(function(p){ return p.value; }).filter(function(v){ return v !== null && v !== undefined; });
  var minV = opts.min != null ? opts.min : (vals.length ? Math.min.apply(null, vals) : 0);
  var maxV = opts.max != null ? opts.max : (vals.length ? Math.max.apply(null, vals) : 1);
  if(maxV === minV){ maxV = minV + 1; }
  var n = series.length || 1;
  var innerW = w - padL - padR, innerH = h - padT - padB;
  function xAt(i){ return padL + (n===1 ? innerW/2 : (i/(n-1))*innerW); }
  function yAt(v){
    if(v === null || v === undefined) return null;
    return padT + innerH * (1 - (v - minV)/(maxV - minV));
  }
  var pts = [];
  series.forEach(function(p,i){
    var y = yAt(p.value);
    if(y !== null) pts.push({ x: xAt(i), y: y, v: p.value, label: p.label });
  });
  var line = pts.map(function(p,i){ return (i?"L":"M")+p.x.toFixed(1)+","+p.y.toFixed(1); }).join(" ");
  var area = pts.length ? (line + " L"+pts[pts.length-1].x.toFixed(1)+","+(padT+innerH)+" L"+pts[0].x.toFixed(1)+","+(padT+innerH)+" Z") : "";
  var stroke = opts.stroke || "#3b82f6";
  var fill = opts.fill || "rgba(59,130,246,.18)";
  var dots = pts.map(function(p){
    return '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="3.5" fill="'+stroke+'" stroke="#fff" stroke-width="1.5"/>';
  }).join("");
  var labels = series.map(function(p,i){
    return '<text x="'+xAt(i).toFixed(1)+'" y="'+(h-8)+'" text-anchor="middle" font-size="9" fill="'+(opts.labelColor||'#64748b')+'">'+escapeHtml(p.label)+'</text>';
  }).join("");
  var gridY = "";
  for(var g=0;g<3;g++){
    var gy = padT + (innerH*g/2);
    gridY += '<line x1="'+padL+'" y1="'+gy+'" x2="'+(w-padR)+'" y2="'+gy+'" stroke="'+(opts.grid||'#e2e8f0')+'" stroke-width="1"/>';
  }
  return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" role="img">'+
    gridY +
    (area ? '<path d="'+area+'" fill="'+fill+'"/>' : '') +
    (line ? '<path d="'+line+'" fill="none" stroke="'+stroke+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' : '') +
    dots + labels +
  '</svg>';
}

/** Rating colors — same bands as Excel conditional formatting */
function ratingColor(v){
  if(v===null || v===undefined || v==="" || isNaN(Number(v))) return "#0f172a"; // no result → dark blue
  v = Number(v);
  if(v >= 9.5) return "var(--blue)";           // 9.5 – 10  blue
  if(v >= 8.5) return "#166534";               // 8.5 – 9.4 dark green
  if(v >= 7.0) return "#16a34a";               // 7.0 – 8.4 green
  if(v >= 6.1) return "#F9E79F";               // 6.1 – 6.9 light yellow
  return "var(--red)";                        // ≤ 6.0 red (incl. 5.1–6.0)
}
function ratingColorHex(v){
  if(v===null||v===undefined||v===""||isNaN(Number(v))) return "#0f172a"; // no result → dark blue
  v = Number(v);
  if(v >= 9.5) return "#2563eb";  // blue
  if(v >= 8.5) return "#166534";  // dark green
  if(v >= 7.0) return "#22c55e";  // green
  if(v >= 6.1) return "#F9E79F";  // light yellow
  return "#ef4444";              // red (5.1–6.0 and below)
}
/** Remark label next to rating — same logic as Excel IF formula */
function ratingRemark(v){
  if(v===null||v===undefined||v===""||isNaN(Number(v))) return "";
  v = Number(v);
  if(v >= 9.5 && v <= 10) return "🚩 Role Model";
  if(v >= 8.5 && v < 9.5) return "👍 Meets Expectations";
  if(v >= 7 && v < 8.5) return "👎 Below Expectations";
  if(v >= 6.1 && v < 7) return "👎 Below Expectations";
  if(v >= 5.1 && v < 6.1) return "🚨 Warning";
  return "⛔ Critical Attention Required";
}

function fiscalYearOf(dateStr){
  // FY starts July 1. returns starting calendar year of FY, e.g. 2026 => FY2026 (Jul2026-Jun2027)
  var d = new Date(dateStr+"T00:00:00");
  var y = d.getFullYear(), m = d.getMonth()+1; // 1-12
  return (m>=7) ? y : y-1;
}
function fyLabel(startYear){

}

}

// average rating across all departments for a given date (using effective/carried values)
function factoryAverageOnDate(dateStr, deptsList, ratingsObj){
  var depts = deptsList || state.config.departments;
  ratingsObj = ratingsObj || state.ratings;
  var sum=0,count=0;
  depts.forEach(function(dep){
    var v = effectiveRating(dep.id, dateStr, null, ratingsObj);
    if(v!==null){ sum+=v; count++; }
  });
  return count? (sum/count) : null;
}

// average rating for a dept across a date range [start,end] inclusive, weekdays only,
// using carried-forward values for missing weekdays.
function deptAverageRange(deptId, startStr, endStr, ratingsObj){
  ratingsObj = ratingsObj || state.ratings;
  var today = todayStr();
  var end = endStr < today ? endStr : today;
  // Seed once, then carry forward day-by-day (O(days) not O(days*lookback))
  var last = effectiveRating(deptId, startStr, 90, ratingsObj);
  var d = startStr, sum=0, count=0, guard=0;
  while(d<=end && guard<400){
    guard++;
    if(!isWeekend(d)){
      var dayRatings = ratingsObj[d];
      if(dayRatings && typeof dayRatings[deptId] === "number") last = dayRatings[deptId];
      if(last!==null){ sum+=last; count++; }
    }
    d = addDays(d,1);
  }
  return count? (sum/count) : null;
}
function factoryAverageRange(startStr,endStr,deptsList,ratingsObj){
  var depts = deptsList || state.config.departments;
  ratingsObj = ratingsObj || state.ratings;
  var sum=0,count=0;
  depts.forEach(function(dep){
    var v = deptAverageRange(dep.id,startStr,endStr,ratingsObj);
    if(v!==null){ sum+=v; count++; }
  });
  return count? (sum/count):null;
}

// sum awareness (persons made aware of 5S) across a date range [start,end] inclusive.
// unlike ratings, this is a count of events entered on each date, not carried forward.
function awarenessSumRange(startStr,endStr){
  var staff=0, gr=0;
  var today = todayStr();
  var end = endStr < today ? endStr : today;
  var d = startStr, guard=0;
  while(d<=end && guard<3000){
    guard++;
    var rec = state.awareness[d];
    if(rec){ staff += (rec.staff||0); gr += (rec.gr||0); }
    d = addDays(d,1);
  }
  return {staff:staff, gr:gr};
}
function awarenessOnDate(dateStr){
  var rec = state.awareness[dateStr];
  return { staff: rec ? (rec.staff||0) : 0, gr: rec ? (rec.gr||0) : 0 };
}

/* ============================================================
   GLOBAL FORM FIELD ARROW-KEY NAVIGATION (entire platform)
============================================================ */
function isFormNavField(el){
  if(!el || el.disabled || el.readOnly) return false;
  var tag = (el.tagName || "").toLowerCase();
  if(tag === "textarea" || tag === "select") return true;
  if(tag !== "input") return false;
  var type = (el.type || "text").toLowerCase();
  // Skip file and button-like inputs; include text/number/date/etc and checkboxes
  if(type === "file" || type === "button" || type === "submit" || type === "reset" || type === "hidden" || type === "image") return false;
  return true;
}
function collectFormNavFields(root){
  root = root || document.getElementById("app") || document;
  var nodes = root.querySelectorAll("input, textarea, select");
  var list = [];
  for(var i=0;i<nodes.length;i++){
    if(isFormNavField(nodes[i]) && nodes[i].offsetParent !== null) list.push(nodes[i]);
  }
  // stable visual order
  list.sort(function(a,b){
    var ar = a.getBoundingClientRect(), br = b.getBoundingClientRect();
    if(Math.abs(ar.top - br.top) > 12) return ar.top - br.top;
    return ar.left - br.left;
  });
  return list;
}
function focusFormField(el){
  if(!el) return;
  el.focus();
  try{
    if(typeof el.select === "function" && el.tagName === "INPUT" && (el.type==="text"||el.type==="number"||el.type==="search"||!el.type)){
      el.select();
    }
  }catch(e){}
}
if(!window.__formArrowNavBound){
  window.__formArrowNavBound = true;
  document.addEventListener("keydown", function(e){
    if(e.key !== "ArrowDown" && e.key !== "ArrowUp" && e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    var t = e.target;
    if(!isFormNavField(t)) return;
    // Let left/right move the caret inside text when not at the edge
    if((e.key === "ArrowLeft" || e.key === "ArrowRight") && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")){
      try{
        var start = t.selectionStart, end = t.selectionEnd, len = (t.value || "").length;
        if(typeof start === "number"){
          if(e.key === "ArrowLeft" && start > 0) return;
          if(e.key === "ArrowRight" && end < len) return;
        }
      }catch(err){}
    }
    // Select: left/right change option natively — only intercept up/down for field jump
    if(t.tagName === "SELECT" && (e.key === "ArrowLeft" || e.key === "ArrowRight")) return;

    var list = collectFormNavFields();
    if(list.length < 2) return;
    var idx = list.indexOf(t);
    if(idx < 0) return;
    var next = idx;
    if(e.key === "ArrowDown" || e.key === "ArrowRight") next = Math.min(list.length - 1, idx + 1);
    if(e.key === "ArrowUp" || e.key === "ArrowLeft") next = Math.max(0, idx - 1);
    if(next === idx) return;
    e.preventDefault();
    focusFormField(list[next]);
  }, true);
}

      '<label>Color<input type="color" id="ze-color" value="#3b82f6"></label>'+
      '<label>Border color<input type="color" id="ze-bcolor" value="#0f172a"></label>'+
      '<label>Border (px)<input type="number" id="ze-bwidth" min="0" max="8" step="1" value="1"></label>'+
      '<label>Width %<input type="number" id="ze-w" min="4" max="60" step="0.5" value="14"></label>'+
      '<label>Height %<input type="number" id="ze-h" min="4" max="60" step="0.5" value="16"></label>'+
      '<label>Left %<input type="number" id="ze-left" min="0" max="95" step="0.5" value="8"></label>'+
      '<label>Top %<input type="number" id="ze-top" min="0" max="95" step="0.5" value="10"></label>'+
      '<div class="zone-edit-actions">'+
        '<button type="button" class="btn primary small" id="ze-apply">Apply</button>'+
        '<button type="button" class="btn small" id="ze-save">Save layout</button>'+
        '<button type="button" class="btn small" id="ze-reset-one">Reset zone</button>'+
        '<span class="mono" id="ze-msg" style="font-size:11px;color:#64748b;"></span>'+

    body.appendChild(edit);
    body.appendChild(stage);
    legendHost = el('<div class="floor3d-legend"></div>');

    applyFloorPlanBg();

    function toHexColor(c){
      if(!c) return "#3b82f6";
      if(c.charAt(0) === "#" && c.length >= 7) return c.slice(0,7);
      try{
        var ctx = document.createElement("canvas").getContext("2d");
        ctx.fillStyle = "#000";
        ctx.fillStyle = c;
        var v = ctx.fillStyle;
        if(v.charAt(0) === "#") return v.length === 4 ? ("#"+v[1]+v[1]+v[2]+v[2]+v[3]+v[3]) : v;
      }catch(e){}
      return "#3b82f6";
    }
    function selectZone(id){
      var sel = edit.querySelector('#ze-id');
      if(sel) sel.value = id || "";
      var d = depts.find(function(x){ return x.id === id; });
      if(!d) return;
      var i = depts.indexOf(d);
      var st = zoneStyle(d, i);
      edit.querySelector('#ze-color').value = toHexColor(st.color);
      edit.querySelector('#ze-bcolor').value = toHexColor(st.borderColor);
      edit.querySelector('#ze-bwidth').value = st.borderW;
      edit.querySelector('#ze-w').value = st.w;
      edit.querySelector('#ze-h').value = st.h;
      edit.querySelector('#ze-left').value = st.left;
      edit.querySelector('#ze-top').value = st.top;
      paintBlocks(id);
    }
    function applyFromForm(){
      var id = edit.querySelector('#ze-id').value;
      if(!id){ edit.querySelector('#ze-msg').textContent = "Select a zone first."; return; }
      state.zoneLayout[id] = {
        left: parseFloat(edit.querySelector('#ze-left').value) || 0,
        top: parseFloat(edit.querySelector('#ze-top').value) || 0,
        w: parseFloat(edit.querySelector('#ze-w').value) || 10,

        color: edit.querySelector('#ze-color').value,
        borderW: parseFloat(edit.querySelector('#ze-bwidth').value) || 0,
        borderColor: edit.querySelector('#ze-bcolor').value
      };
      paintBlocks(id);
      edit.querySelector('#ze-msg').textContent = "Applied (click Save layout to keep).";
    }
    edit.querySelector('#ze-id').addEventListener('change', function(){ selectZone(this.value); });
    edit.querySelector('#ze-apply').addEventListener('click', applyFromForm);
    edit.querySelector('#ze-save').addEventListener('click', async function(){
      applyFromForm();
      try{
        await saveZoneLayout();
        edit.querySelector('#ze-msg').textContent = "Layout saved.";
      }catch(err){ edit.querySelector('#ze-msg').textContent = "Save failed."; }
    });
    edit.querySelector('#ze-reset-one').addEventListener('click', function(){
      var id = edit.querySelector('#ze-id').value;
      if(!id) return;
      delete state.zoneLayout[id];
      selectZone(id);
      edit.querySelector('#ze-msg').textContent = "Zone reset to default (save to keep).";
    });
    ['ze-color','ze-bcolor','ze-bwidth','ze-w','ze-h','ze-left','ze-top'].forEach(function(id){
      var node = edit.querySelector('#'+id);
      if(node) node.addEventListener('input', function(){ if(edit.querySelector('#ze-id').value) applyFromForm(); });
    });

    // Floor plan file handlers
    planFile.addEventListener('change', async function(){
      var f = planFile.files && planFile.files[0];
      if(!f) return;
      if(f.size > 6*1024*1024){
        if(!confirm("This image is larger than 6 MB and may fail to save in browser storage. Continue?")) return;
      }
      try{
        planMsg.textContent = "Loading…";
        var dataUrl = await fileToDataUrlRaw(f);
        // downscale large plans for storage
        try{
          var img = await new Promise(function(res,rej){ var im=new Image(); im.onload=function(){res(im);}; im.onerror=rej; im.src=dataUrl; });
          var maxW = 1600;
          if(img.width > maxW){
            var c = document.createElement("canvas");
            var ratio = maxW / img.width;
            c.width = maxW; c.height = Math.round(img.height * ratio);
            c.getContext("2d").drawImage(img,0,0,c.width,c.height);
            dataUrl = c.toDataURL("image/jpeg", 0.85);
          }
        }catch(e){}
        state.floorPlanImage = dataUrl;
        await saveFloorPlan();
        applyFloorPlanBg();
        paintBlocks(edit.querySelector('#ze-id').value || null);
        setPreset('above');
        toolbar.querySelectorAll('[data-view3d]').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-view3d')==='above'); });
        planMsg.textContent = "Floor plan saved.";
      }catch(err){
        planMsg.textContent = "Could not load image.";
      }
    });
    planClear.addEventListener('click', async function(){
      state.floorPlanImage = "";
      await saveFloorPlan();
      applyFloorPlanBg();
      paintBlocks(edit.querySelector('#ze-id').value || null);
      planFile.value = "";
      planMsg.textContent = "Floor plan removed.";
    });

    // 3D view controls
    var view3d = state.floorPlanImage
      ? { rotX: 0, rotZ: 0, scale: 1.0 }
      : { rotX: 58, rotZ: -18, scale: 0.92 };
    function applyView3d(){
      view3d.rotX = Math.max(0, Math.min(85, view3d.rotX));
      view3d.scale = Math.max(0.45, Math.min(2.4, view3d.scale));
      world.style.transform = 'rotateX('+view3d.rotX+'deg) rotateZ('+view3d.rotZ+'deg) scale('+view3d.scale+')';
      if(view3d.rotX < 12){ world.classList.add('flat-blocks'); } else { world.classList.remove('flat-blocks'); }
    }
    function setPreset(mode){
      if(mode==='above'){ view3d.rotX = 0; view3d.rotZ = 0; view3d.scale = 1.0; }
      else if(mode==='left'){ view3d.rotX = 55; view3d.rotZ = 55; view3d.scale = 0.95; }
      else if(mode==='right'){ view3d.rotX = 55; view3d.rotZ = -55; view3d.scale = 0.95; }
      else if(mode==='front'){ view3d.rotX = 62; view3d.rotZ = 0; view3d.scale = 0.95; }
      else { view3d.rotX = 58; view3d.rotZ = -18; view3d.scale = 0.92; }
      applyView3d();
    }
    applyView3d();
    toolbar.querySelectorAll('[data-view3d]').forEach(function(btn){
      btn.addEventListener('click', function(){
        toolbar.querySelectorAll('[data-view3d]').forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        setPreset(btn.getAttribute('data-view3d'));
      });
    });

    var dragging = false, lastX = 0, lastY = 0;
    stage.addEventListener('pointerdown', function(e){
      if(e.target && e.target.closest && e.target.closest('.floor3d-block')) return;
      if(e.pointerType==='touch' && e.isPrimary === false) return;
      dragging = true; lastX = e.clientX; lastY = e.clientY;
      stage.classList.add('is-dragging');
      try{ stage.setPointerCapture(e.pointerId); }catch(err){}
    });
    stage.addEventListener('pointermove', function(e){
      if(!dragging) return;
      if(e.pointerType==='touch' && window.__floor3dPinching) return;
      var dx = e.clientX - lastX, dy = e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      view3d.rotZ += dx * 0.35;
      view3d.rotX -= dy * 0.25;
      applyView3d();
    });
    function endDrag(e){
      dragging = false; stage.classList.remove('is-dragging');
      try{ stage.releasePointerCapture(e.pointerId); }catch(err){}
    }
    stage.addEventListener('pointerup', endDrag);
    stage.addEventListener('pointercancel', endDrag);
    stage.addEventListener('wheel', function(e){
      e.preventDefault();
      view3d.scale *= (e.deltaY > 0 ? 0.92 : 1.08);
      applyView3d();
    }, { passive:false });
    var pinchStartDist = 0, pinchStartScale = 1;
    window.__floor3dPinching = false;
    function touchDist(t1, t2){
      var dx = t1.clientX - t2.clientX, dy = t1.clientY - t2.clientY;
      return Math.sqrt(dx*dx + dy*dy);
    }
    stage.addEventListener('touchstart', function(e){
      if(e.touches.length === 2){
        window.__floor3dPinching = true; dragging = false;
        pinchStartDist = touchDist(e.touches[0], e.touches[1]);
        pinchStartScale = view3d.scale;
      }
    }, { passive:true });
    stage.addEventListener('touchmove', function(e){
      if(e.touches.length === 2 && pinchStartDist > 0){
        e.preventDefault();
        view3d.scale = pinchStartScale * (touchDist(e.touches[0], e.touches[1]) / pinchStartDist);
        applyView3d();
      }
    }, { passive:false });
    stage.addEventListener('touchend', function(e){
      if(e.touches.length < 2){ window.__floor3dPinching = false; pinchStartDist = 0; }
    });

    body.appendChild(el('<h4 style="margin:20px 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Zone list</h4>'));
    var grid = el('<div class="zone-grid"></div>');
    depts.forEach(function(d, i){
      var st = zoneStyle(d, i);
      var card = el(
        '<div class="zone-card" style="--zcolor:'+st.color+';cursor:pointer;">'+
          '<div class="z-label">Zone '+(i+1)+'</div>'+
          '<div class="z-name">'+escapeHtml(d.name)+'</div>'+
          '<div class="z-code">'+escapeHtml(d.id)+'</div>'+
          '<div class="z-champ">Champion: '+escapeHtml(d.champion||'Unassigned')+'</div>'+
        '</div>'
      );
      card.addEventListener('click', function(){ selectZone(d.id); });
      grid.appendChild(card);
    });
    body.appendChild(grid);

    if(office.length){
      body.appendChild(el('<h4 style="margin:18px 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Office Zones</h4>'));
      var grid2 = el('<div class="zone-grid"></div>');
      office.forEach(function(d, i){
        var color = zoneColors[(i+3) % zoneColors.length];
        grid2.appendChild(el(
          '<div class="zone-card" style="--zcolor:'+color+'">'+
            '<div class="z-label">Office Zone</div>'+
            '<div class="z-name">'+escapeHtml(d.name)+'</div>'+
            '<div class="z-code">'+escapeHtml(d.id)+'</div>'+
            '<div class="z-champ">Champion: '+escapeHtml(d.champion||'Unassigned')+'</div>'+
          '</div>'
        ));
      });
      body.appendChild(grid2);
    }
  }

  modal.appendChild(head);
  modal.appendChild(body);
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
  requestAnimationFrame(function(){ overlay.classList.add('open'); });
  function close(){
    overlay.classList.remove('open');
    try{
      if(document.fullscreenElement){
        var exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
        if(exit) exit.call(document);
      }
    }catch(e){}
    try{
      if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
    }catch(e){}
    setTimeout(function(){ if(overlay.parentNode) overlay.parentNode.removeChild(overlay); }, 180);
    document.removeEventListener('keydown', onKey);
  }
  function onKey(e){ if(e.key==='Escape') close(); }
  head.querySelector('.org-close').addEventListener('click', close);
  overlay.addEventListener('click', function(e){ if(e.target===overlay) close(); });
  document.addEventListener('keydown', onKey);
}

function animateResults(root){
  if(!root) return;
  // Stagger cards / list rows / plates
  var items = root.querySelectorAll(".stat-card, .regional-factory-card, .plate, .hbar-row, .bw-item, .tool-card, .video-card, .photo-card, .share-post, .kz-info, .bom-public-card, .home-frame, .rating-trends-box, .admin-panel, .mynotes-table-wrap, .outlook-card");
  for(var i=0;i<items.length;i++){
    items[i].classList.add("anim-item");
    items[i].style.animationDelay = (Math.min(i, 16) * 0.045) + "s";
  }

  // Animate bar widths from 0 -> target
  var fills = root.querySelectorAll(".hbar-fill, .waste-bar-fill, .bar, .regional-bar-fill, .kz-vbar");
  for(var b=0;b<fills.length;b++){
    (function(el){
      var target = el.style.width || "";
      if(!target){
        var computed = window.getComputedStyle(el).width;
        // skip if no useful target
      }
      if(!target || target === "0px" || target === "0%") return;
      el.setAttribute("data-target-width", target);
      el.classList.add("anim-bar-ready");
      el.style.width = "0%";
      // force reflow then animate to target
      void el.offsetWidth;
      requestAnimationFrame(function(){
        el.classList.remove("anim-bar-ready");
        el.style.width = target;
      });
    })(fills[b]);
  }

  // Count-up numbers in KPI / rating displays
  var nums = root.querySelectorAll(".stat-card .num, .ratingnum, .big-rating, .rf-rating, .regional-bar-val, .hbar-value, .waste-bar-val, .hbar-training");
  for(var n=0;n<nums.length;n++){
    (function(el, delayIdx){
      var raw = (el.textContent || "").trim();
      // Extract leading number (supports decimals)
      var m = raw.match(/^(-?\d+(?:[.,]\d+)?)(.*)$/);
      if(!m) return;
      var suffix = m[2] || "";
      var target = parseFloat(String(m[1]).replace(",", "."));
      if(isNaN(target)) return;
      var isInt = Math.abs(target % 1) < 1e-9;
      var duration = 700;
      var start = performance.now() + Math.min(delayIdx, 12) * 40;
      el.textContent = (isInt ? "0" : "0.0") + suffix;
      el.classList.add("anim-num");
      function tick(now){
        if(now < start){ requestAnimationFrame(tick); return; }
        var t = Math.min(1, (now - start) / duration);
        // easeOutCubic
        var e = 1 - Math.pow(1 - t, 3);
        var val = target * e;
        el.textContent = (isInt ? String(Math.round(val)) : (Math.round(val * 10) / 10).toFixed(1)) + suffix;
        if(t < 1) requestAnimationFrame(tick);
        else el.textContent = (isInt ? String(Math.round(target)) : (Math.round(target * 10) / 10).toFixed(1)) + suffix;
      }
      requestAnimationFrame(tick);
    })(nums[n], n);
  }
}

function renderMainContent(mainEl){
  mainEl.innerHTML = "";
  var node = null;
  if(state.view==="home5s") node = renderHome5S();
  else if(state.view==="dept") node = renderDeptDetail(state.routeParam, "dept");
  else if(state.view==="officedept") node = renderDeptDetail(state.routeParam, "office");
  else if(state.view==="kaizenHome") node = renderKaizenHome();
  else if(state.view==="kaizenDetail") node = renderKaizenDetail(state.routeParam);
  else if(state.view==="improvements") node = renderOurImprovements();
  else if(state.view==="beyondBoundaries") node = renderBeyondBoundaries();
  else if(state.view==="regional") node = renderRegionalWise();
  else if(state.view==="admin") node = renderAdmin();
  else if(state.view==="tools") node = renderTools();
  if(node){
    node.classList.add("page-anim-enter");
    mainEl.appendChild(node);
    // Run after DOM paint so widths/layout are available
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ animateResults(mainEl); });
    });
  }
}

function fileToDataUrlRaw(file){ return new Promise(function(resolve,reject){ var r=new FileReader(); r.onload=function(){resolve(r.result);}; r.onerror=reject; r.readAsDataURL(file); }); }
async function fileToDataUrl(file){
  var url = await fileToDataUrlRaw(file);
  if(file && String(file.type||'').indexOf('image/')===0){
    try{ return await cropImageDataUrl(url); }catch(e){ return url; }
  }
  return url;
}

/** Open a simple crop UI; resolves with cropped JPEG data URL (or original if cancelled/skip). */
function cropImageDataUrl(dataUrl, opts){
  opts = opts || {};
  return new Promise(function(resolve){
    var overlay = el('<div class="crop-overlay"></div>');
    var modal = el(
      '<div class="crop-modal">'+
        '<h4>Crop photo</h4>'+
        '<div class="crop-aspect-row" id="crop-aspect-row">'+
          '<span style="font-size:12px;color:#64748b;margin-right:4px;">Shape</span>'+
          '<button type="button" data-aspect="1" class="active">Square</button>'+
          '<button type="button" data-aspect="1.333">Rectangle 4:3</button>'+
          '<button type="button" data-aspect="0.75">Portrait 3:4</button>'+
          '<button type="button" data-aspect="1.778">Wide 16:9</button>'+
        '</div>'+
        '<div class="crop-stage"><img alt="Crop"><div class="crop-frame"></div></div>'+
        '<div class="crop-tools">'+
          '<label style="font-size:12px;color:#64748b;">Zoom</label>'+
          '<input type="range" min="1" max="3" step="0.01" value="1" id="crop-zoom">'+
          '<button type="button" class="btn small" id="crop-skip">Use full photo</button>'+
          '<button type="button" class="btn primary" id="crop-ok">Apply crop</button>'+
        '</div>'+
      '</div>'
    );
    overlay.appendChild(modal);
    document.body.appendChild(overlay);
    overlay.style.zIndex = '100000';

    var img = modal.querySelector('img');
    var stage = modal.querySelector('.crop-stage');
    var frame = modal.querySelector('.crop-frame');
    var zoomInp = modal.querySelector('#crop-zoom');
    var scale = 1, ox = 0, oy = 0, dragging = false, lx = 0, ly = 0, baseW = 0, baseH = 0;
    var aspect = 1; // width / height

    function setFrameAspect(a){
      aspect = a || 1;
      var maxW = Math.min(stage.clientWidth * 0.86, 300);
      var maxH = Math.min(stage.clientHeight * 0.86, 300);
      var w, h;
      if(aspect >= 1){
        w = maxW;
        h = w / aspect;
        if(h > maxH){ h = maxH; w = h * aspect; }
      } else {
        h = maxH;
        w = h * aspect;
        if(w > maxW){ w = maxW; h = w / aspect; }
      }
      frame.style.width = w + 'px';
      frame.style.height = h + 'px';
      frame.style.aspectRatio = aspect + ' / 1';
      frame.style.borderRadius = '10px';
    }

    function applyTransform(){
      img.style.width = (baseW * scale) + 'px';
      img.style.height = (baseH * scale) + 'px';
      img.style.transform = 'translate(calc(-50% + '+ox+'px), calc(-50% + '+oy+'px))';
    }
    img.onload = function(){
      var sw = stage.clientWidth, sh = stage.clientHeight;
      var ratio = Math.max(sw / img.naturalWidth, sh / img.naturalHeight);
      baseW = img.naturalWidth * ratio;
      baseH = img.naturalHeight * ratio;
      setFrameAspect(aspect);
      applyTransform();
    };
    img.src = dataUrl;

    modal.querySelectorAll('#crop-aspect-row button[data-aspect]').forEach(function(btn){
      btn.addEventListener('click', function(){
        modal.querySelectorAll('#crop-aspect-row button').forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        setFrameAspect(parseFloat(btn.getAttribute('data-aspect')) || 1);
      });
    });

    stage.addEventListener('pointerdown', function(e){
      dragging = true; lx = e.clientX; ly = e.clientY; stage.classList.add('is-drag');
      try{ stage.setPointerCapture(e.pointerId); }catch(err){}
    });
    stage.addEventListener('pointermove', function(e){
      if(!dragging) return;
      ox += (e.clientX - lx); oy += (e.clientY - ly);
      lx = e.clientX; ly = e.clientY;
      applyTransform();
    });
    function endDrag(){ dragging = false; stage.classList.remove('is-drag'); }
    stage.addEventListener('pointerup', endDrag);
    stage.addEventListener('pointercancel', endDrag);
    zoomInp.addEventListener('input', function(){ scale = parseFloat(zoomInp.value)||1; applyTransform(); });

    function close(result){
      if(overlay.parentNode) overlay.parentNode.removeChild(overlay);
      resolve(result);
    }
    modal.querySelector('#crop-skip').addEventListener('click', function(){ close(dataUrl); });
    modal.querySelector('#crop-ok').addEventListener('click', function(){
      var fr = frame.getBoundingClientRect();
      var ir = img.getBoundingClientRect();
      var outW = opts.size || 768;
      var outH = Math.max(1, Math.round(outW / (aspect || 1)));
      if(aspect < 1){
        outH = opts.size || 768;
        outW = Math.max(1, Math.round(outH * aspect));
      }
      var canvas = document.createElement('canvas');
      canvas.width = outW; canvas.height = outH;
      var ctx = canvas.getContext('2d');
      var scaleX = img.naturalWidth / ir.width;
      var scaleY = img.naturalHeight / ir.height;
      var sx = (fr.left - ir.left) * scaleX;
      var sy = (fr.top - ir.top) * scaleY;
      var sw = fr.width * scaleX;
      var sh = fr.height * scaleY;
      try{
        // Rectangular / square crop (no circular mask)
        ctx.clearRect(0, 0, outW, outH);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, outW, outH);
        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, outW, outH);
        close(canvas.toDataURL('image/jpeg', 0.92));
      }catch(err){
        close(dataUrl);
      }
    });
  });
}

/** Load an image from File or data URL */
function loadImageSource(src){
  return new Promise(function(resolve, reject){
    var img = new Image();
    img.onload = function(){ resolve(img); };
    img.onerror = reject;
    if(typeof src === "string"){
      img.src = src;
    } else {
      var url = URL.createObjectURL(src);
      img.onload = function(){ URL.revokeObjectURL(url); resolve(img); };
      img.src = url;
    }
  });
}

/**
 * Crop image to a square focused on the face (when detectable),
 * otherwise use a portrait-friendly upper-center crop.
 * Returns a JPEG data URL suitable for circular avatars.
 */
async function smartFaceCropDataUrl(src, outSize){
  outSize = outSize || 320;
  var img = await loadImageSource(src);
  var w = img.naturalWidth || img.width;
  var h = img.naturalHeight || img.height;
  if(!w || !h) throw new Error("Invalid image");

  // Default: head-and-shoulders style (upper portrait), not a tight face crop
  var cx = w / 2;
  var cy = h * 0.36;
  var side = Math.min(w, h) * 0.72;

  try{
    if(typeof FaceDetector === "function"){
      var detector = new FaceDetector({ fastMode: false, maxDetectedFaces: 1 });
      var faces = await detector.detect(img);
      if(faces && faces.length){
        var box = faces[0].boundingBox;
        var faceSize = Math.max(box.width, box.height);
        // Wide enough for full head + hair + upper shoulders (matches circular profile draft)
        side = faceSize * 2.75;
        cx = box.x + box.width / 2;
        // Slightly below face center so shoulders enter the circle, hair stays inside
        cy = box.y + box.height * 0.55 + faceSize * 0.15;
        // Desired top of crop: well above hairline
        var desiredTop = box.y - faceSize * 0.85;
        var desiredBottom = box.y + box.height + faceSize * 1.15;
        side = Math.max(side, (desiredBottom - desiredTop) * 0.98);
        cy = (desiredTop + desiredBottom) / 2;
      }
    }
  }catch(e){ /* portrait heuristic */ }

  side = Math.min(Math.max(side, Math.min(w, h) * 0.5), Math.min(w, h));
  var sx = cx - side / 2;
  var sy = cy - side / 2;
  // Clamp inside image, preferring to keep the top of the head
  if(sx < 0) sx = 0;
  if(sy < 0) sy = 0;
  if(sx + side > w) sx = w - side;
  if(sy + side > h) sy = h - side;
  if(sx < 0) sx = 0;
  if(sy < 0) sy = 0;

  var canvas = document.createElement("canvas");
  canvas.width = outSize;
  canvas.height = outSize;
  var ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  // Soft fill in case of edge letterboxing (shouldn't happen with clamp)
  ctx.fillStyle = "#1e293b";
  ctx.fillRect(0, 0, outSize, outSize);
  ctx.drawImage(img, sx, sy, side, side, 0, 0, outSize, outSize);
  return canvas.toDataURL("image/jpeg", 0.92);
}

async function championPhotoFromFile(file){
  try{
    return await smartFaceCropDataUrl(file, 256);
  }catch(e){
    console.warn("Face crop failed, using full image", e);
    return await fileToDataUrl(file);
  }
}

/* ============================================================
   CAMERA CAPTURE UTILITIES (used by photo-url-input fields)
============================================================ */
function compressImageFile(file, maxDim, quality){
  return new Promise(function(resolve,reject){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var w=img.width, h=img.height;
        var scale = Math.min(1, maxDim/Math.max(w,h));
        var cw = Math.max(1,Math.round(w*scale)), ch = Math.max(1,Math.round(h*scale));
        var canvas = document.createElement("canvas");
        canvas.width=cw; canvas.height=ch;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img,0,0,cw,ch);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = function(){ reject(new Error("bad image")); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ reject(new Error("read failed")); };
    reader.readAsDataURL(file);
  });
}
// wires a camera button to a text input holding a photo URL / data-URI.
// File picker: gallery and camera both available on mobile (no capture= force-camera)ectly.
function wirePhotoField(cameraBtn, urlInput, previewImg){
  if(cameraBtn.dataset.wired) return;
  cameraBtn.dataset.wired = "1";
  var fileInp = document.createElement("input");
  fileInp.type="file"; fileInp.accept="image/*";
  fileInp.style.display="none";
  cameraBtn.parentNode.appendChild(fileInp);
  cameraBtn.addEventListener("click", function(){ fileInp.click(); });
  fileInp.addEventListener("change", async function(){
    if(!fileInp.files || !fileInp.files[0]) return;
    var origLabel = cameraBtn.textContent;
    cameraBtn.textContent = "\u2026";
    cameraBtn.disabled = true;
    try{
      var dataUrl = await compressImageFile(fileInp.files[0], 900, 0.62);
      urlInput.value = dataUrl;
      urlInput.dispatchEvent(new Event("input",{bubbles:true}));
      urlInput.dispatchEvent(new Event("change",{bubbles:true}));
      if(previewImg) previewImg.src = dataUrl;
    }catch(err){ alert("Could not capture that photo. Please try again."); }
    cameraBtn.textContent = origLabel;
    cameraBtn.disabled = false;
    fileInp.value = "";
  });
}
// scans a container for .photo-url-input fields not yet enhanced, and adds a camera button before each.
function enhancePhotoInputs(root){
  if(!root) return;
  root.querySelectorAll(".photo-url-input").forEach(function(inp){
    if(inp.dataset.enhanced) return;
    inp.dataset.enhanced = "1";
    var btn = document.createElement("button");
    btn.type="button"; btn.className="btn small cam-btn"; btn.textContent="\ud83d\udcf7";
    btn.title="Take a photo with your camera";
    inp.parentNode.insertBefore(btn, inp);
    wirePhotoField(btn, inp, null);
  });
}

        trainingHtml+
        '<div class="hbar-champ">'+avHtml+'<span class="hbar-champ-name">'+escapeHtml(cn)+'</span></div>'+

    hbarList.appendChild(row);
  });
  inner.appendChild(hbarList);
  chartBlock.appendChild(collapsibleBody(opts.sectionId, inner));
  return chartBlock;
}

    if(entries.length<10){
      var add = el('<button class="btn small" type="button">+ Add Best 5S Photo</button>');
      add.addEventListener('click', function(){
        state.bestOfMonth.push({id:'bom_'+Date.now(), image:'', comment:'', quarterLabel:'', createdAt:Date.now()});
        renderItems();
      });
      wrap.appendChild(add);
    }
    if(entries.length===0){
      // Start with one editable slot when the tab is opened.
      state.bestOfMonth.push({id:'bom_'+Date.now(), image:'', comment:'', quarterLabel:'', createdAt:Date.now()});
      renderItems();
    }
  }

  renderItems();

  var saveBtn = el('<button class="btn primary" style="margin-top:14px;">Save &amp; Publish to 5S Dashboard</button>');
  var msg = el('<span class="save-msg" style="display:none;">Published on 5S Dashboard.</span>');
  saveBtn.addEventListener('click', async function(){
    var entries = (state.bestOfMonth || []).map(function(e){
      return {
        id: e.id || ('bom_'+Date.now()),
        image: e.image || '',
        comment: e.comment || '',
        quarterLabel: e.quarterLabel || '',
        createdAt: e.createdAt || Date.now()
      };
    });
    var fileEdited = {};
    var files = Array.prototype.slice.call(wrap.querySelectorAll('input[data-bom-file]'));
    for(var z=0; z<files.length; z++){
      if(files[z].files && files[z].files[0]){
        var idx = parseInt(files[z].getAttribute('data-bom-file'),10);
        if(!entries[idx]) continue;
        entries[idx].image = await fileToCroppedDataUrl(files[z].files[0]);
        fileEdited[idx] = true;
      }
    }
    wrap.querySelectorAll('input[data-bom-url]').forEach(function(inp){
      var idx = parseInt(inp.getAttribute('data-bom-url'),10);
      if(!entries[idx]) return;
      if(fileEdited[idx]) return; // keep newly uploaded file
      var typedUrl = inp.value.trim();
      if(typedUrl) entries[idx].image = typedUrl;
      // empty URL field does NOT clear an existing saved photo
    });
    wrap.querySelectorAll('input[data-bom-quarter]').forEach(function(inp){
      var idx = parseInt(inp.getAttribute('data-bom-quarter'),10);
      if(entries[idx]) entries[idx].quarterLabel = inp.value.trim();
    });
    wrap.querySelectorAll('textarea[data-bom-comment]').forEach(function(ta){
      var idx = parseInt(ta.getAttribute('data-bom-comment'),10);
      if(entries[idx]) entries[idx].comment = ta.value.trim();
    });
    // Keep only entries that still have a photo — published set stays until replaced
    state.bestOfMonth = entries.filter(function(e){ return e.image; }).slice(0,10);
    await saveBestOfMonth();
    msg.style.display='inline';
    msg.textContent = 'Published — will stay on 5S Dashboard until you publish a new set.';
    setTimeout(function(){msg.style.display='none';},4000);
    renderItems();
  });
  var btnRow=el('<div></div>'); btnRow.appendChild(saveBtn); btnRow.appendChild(msg); panel.appendChild(btnRow);

  return panel;
}

function reactionKeyArray(key){
  if(key === "like") return "likes";
  if(key === "heart") return "hearts";
  if(key === "happy") return "happies";
  return key;
}
function reactionButtonsHtml(p){
  p = p || {};
  var likes = (p.likes && p.likes.length) || 0;
  var hearts = (p.hearts && p.hearts.length) || 0;
  var happies = (p.happies && p.happies.length) || 0;
  function active(arr){
    return (arr || []).indexOf("visitor") >= 0 ? " active" : "";
  }
  return ''+
    '<div class="reaction-row">'+
      '<button type="button" class="react-btn'+active(p.likes)+'" data-r="like">👍 Like <span class="mono">'+likes+'</span></button>'+
      '<button type="button" class="react-btn'+active(p.hearts)+'" data-r="heart">❤️ Heart <span class="mono">'+hearts+'</span></button>'+
      '<button type="button" class="react-btn'+active(p.happies)+'" data-r="happy">😊 Happy <span class="mono">'+happies+'</span></button>'+
    '</div>';
}
function commentFormHtml(){
  return ''+
    '<div class="comment-form">'+
      '<div class="comment-form-row" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;width:100%;">'+
        '<input type="text" placeholder="Write a comment…" style="flex:1;min-width:120px;">'+
        '<button type="button" class="btn small">Post</button>'+

}

function bindReactionButtons(root, p, saveFn, afterFn){
  root.querySelectorAll("[data-r]").forEach(function(b){
    b.addEventListener("click", async function(e){
      e.stopPropagation();
      var key = b.getAttribute("data-r");
      var arrKey = reactionKeyArray(key);
      p[arrKey] = p[arrKey] || [];
      var visitor = "visitor";
      var idx = p[arrKey].indexOf(visitor);
      if(idx >= 0) p[arrKey].splice(idx, 1); else p[arrKey].push(visitor);
      await saveFn();
      if(afterFn) afterFn();
    });
  });
}
function bindCommentForm(root, p, saveFn, afterFn){
  var form = root.querySelector(".comment-form");
  if(!form) return;
  var ci = form.querySelector("input");
  var cb = form.querySelector(".btn, button.btn, .comment-form-row button");
  form.querySelectorAll(".emoji-btn").forEach(function(btn){
    btn.addEventListener("click", function(e){
      e.stopPropagation();
      if(!ci) return;
      ci.value = (ci.value || "") + btn.getAttribute("data-emoji");
      ci.focus();
    });
  });
  if(ci){
    ci.addEventListener("click", function(e){ e.stopPropagation(); });
    ci.addEventListener("mousedown", function(e){ e.stopPropagation(); });
    ci.addEventListener("keydown", function(e){
      e.stopPropagation();
      if(e.key === "Enter"){ e.preventDefault(); if(cb) cb.click(); }
    });
  }
  if(cb){
    cb.addEventListener("click", async function(e){
      e.stopPropagation();
      var text = (ci && ci.value || "").trim();
      if(!text) return;
      p.comments = p.comments || [];
      p.comments.push({ name: "Visitor", text: text, createdAt: Date.now() });
      await saveFn();
      if(afterFn) afterFn();
    });
  }
}

      '<div class="improvement-detail-media-host"></div>'+
      '<div class="improvement-detail-body">'+
        '<div class="improvement-detail-head"><div class="improvement-detail-title">'+escapeHtml(p.department||'Department')+'</div><div class="improvement-detail-date">'+new Date(p.createdAt||Date.now()).toLocaleString()+'</div></div>'+
        '<div class="improvement-detail-comment">'+escapeHtml(p.comment||'')+'</div>'+
        '<div class="improvement-detail-actions">'+
          reactionButtonsHtml(p)+
          '<div class="share-comments">'+commentHtml(p)+commentFormHtml()+'</div>'+
        '</div>'+
      '</div>';
    var host = content.querySelector('.improvement-detail-media-host');
    if(p.video){
      var v = document.createElement('video');
      v.className = 'improvement-detail-media';
      v.controls = true; v.setAttribute('playsinline','');
      v.src = p.video;
      host.appendChild(v);
    } else if(p.image){
      var im = document.createElement('img');
      im.className = 'improvement-detail-media';
      im.alt = 'Improvement';
      im.src = p.image;
      host.appendChild(im);

  function makeCard(p){

      badgeVid.textContent = '▶ VIDEO';

      '<div class="improvement-card-actions">'+
        reactionButtonsHtml(p)+
        '<div class="share-comments">'+commentHtml(p)+commentFormHtml()+'</div>'+
      '</div>';
    card.appendChild(body);

    card.addEventListener('click', function(e){
