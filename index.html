      openDetail(p);
    });
    card.addEventListener('keydown', function(e){
      if(e.target.closest('.improvement-card-actions')) return;
      if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openDetail(p); }
    });
    bindReactionButtons(card, p, saveImprovements, function(){ paint(); });
    bindCommentForm(card, p, saveImprovements, function(){ paint(); });
    return card;
  }
  function yearOf(p){
    var d = new Date(p.createdAt || Date.now());
    return isNaN(d.getTime()) ? "Unknown" : String(d.getFullYear());
  }
  function dateKey(p){
    var d = new Date(p.createdAt || Date.now());
    if(isNaN(d.getTime())) return "Unknown date";
    return d.toISOString().slice(0,10);
  }
  function fillDeptFilterOptions(all){
    if(!deptFilter) return;
    var cur = state.impDeptFilter || "";
    var names = {};
    all.forEach(function(p){ var n=(p.department||"").trim(); if(n) names[n]=true; });
    var opts = '<option value="">All departments</option>';
    Object.keys(names).sort(function(a,b){ return a.localeCompare(b); }).forEach(function(n){
      opts += '<option value="'+escapeAttr(n)+'"'+(cur===n?' selected':'')+'>'+escapeHtml(n)+'</option>';
    });
    deptFilter.innerHTML = opts;
  }
  function paint(){
    try{
      var q = (state.impSearchDept || "").trim().toLowerCase();
      var deptF = (state.impDeptFilter || "").trim().toLowerCase();
      var groupBy = state.impGroupBy || "year";
      var all = (state.improvements||[]).slice().sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);});
      fillDeptFilterOptions(all);
      var list = all.filter(function(p){
        var dep = String(p.department||"");
        if(deptF && dep.toLowerCase() !== deptF) return false;
        if(q && (dep.toLowerCase().indexOf(q) < 0 && String(p.comment||"").toLowerCase().indexOf(q) < 0)) return false;
        return true;
      });
      if(totalEl) totalEl.textContent = String(list.length);
      if(badge) badge.textContent = list.length + (list.length===1 ? " post" : " posts") + ((q||deptF) ? " · filtered" : "");
      yearsHost.innerHTML = "";
      if(!all.length){
        yearsHost.innerHTML = '<div class="empty-state"><div class="big">—</div>No improvements &amp; best practices have been published yet.</div>';
        return;
      }
      if(!list.length){
        yearsHost.innerHTML = '<div class="empty-state"><div class="big">—</div>No posts match this filter.</div>';
        return;
      }
      var groups = {};
      list.forEach(function(p){
        var key;
        if(groupBy === "department") key = (p.department || "Unassigned").trim() || "Unassigned";
        else if(groupBy === "date") key = dateKey(p);
        else key = yearOf(p);
        if(!groups[key]) groups[key] = [];
        groups[key].push(p);
      });
      var keys = Object.keys(groups);
      if(groupBy === "year") keys.sort(function(a,b){ return (b==="Unknown"?-1:parseInt(b,10)||0) - (a==="Unknown"?-1:parseInt(a,10)||0); });
      else if(groupBy === "date") keys.sort(function(a,b){ return b.localeCompare(a); });
      else keys.sort(function(a,b){ return a.localeCompare(b); });

      keys.forEach(function(k){
        var title = k;
        if(groupBy === "date" && k !== "Unknown date"){
          try{ title = new Date(k+"T00:00:00").toLocaleDateString(); }catch(e){ title = k; }
        }
        var block = document.createElement('div');
        block.className = 'imp-year-block';
        var head = document.createElement('div');
        head.className = 'imp-year-head';
        head.innerHTML = '<h4>'+escapeHtml(title)+'</h4><span class="count">'+groups[k].length+'</span>';
        block.appendChild(head);
        var feed = document.createElement('div');
        feed.className = 'improvement-feed';
        groups[k].forEach(function(p){
          try{ feed.appendChild(makeCard(p)); }
          catch(err){
            console.error('improvement card failed', err);
            var note = document.createElement('div');
            note.className = 'note';
            note.textContent = 'Could not display one post.';
            feed.appendChild(note);
          }
        });
        block.appendChild(feed);
        yearsHost.appendChild(block);
      });
    }catch(err){
      console.error('improvements paint failed', err);
      yearsHost.innerHTML = '<div class="empty-state">Could not load posts. Open the browser console for details.</div>';
    }
  }

  if(groupSel){
    groupSel.value = state.impGroupBy || "year";
    groupSel.addEventListener("change", function(){ state.impGroupBy = groupSel.value; paint(); });
  }
  if(deptFilter){
    deptFilter.addEventListener("change", function(){ state.impDeptFilter = deptFilter.value; paint(); });
  }
  if(searchInp){
    searchInp.value = state.impSearchDept || "";
    searchInp.addEventListener('input', function(){ state.impSearchDept = searchInp.value; paint(); });
    searchInp.addEventListener('keydown', function(e){ e.stopPropagation(); });
  }
  function closeDetail(){ overlay.classList.remove('open'); content.innerHTML=''; }
  if(closeBtn) closeBtn.addEventListener('click', closeDetail);
  if(overlay) overlay.addEventListener('click', function(e){ if(e.target===overlay) closeDetail(); });
  if(overlay){
    if(overlay._escHandler) document.removeEventListener('keydown', overlay._escHandler);
    overlay._escHandler = function(e){ if(e.key==='Escape'&&overlay.classList.contains('open')) closeDetail(); };
    document.addEventListener('keydown', overlay._escHandler);
  }

  // Paint immediately (no setTimeout) so cards always appear with the page
  paint();
  return wrap;
}

            '</div>'+
          '</div>'+
        '</article>'
      );
      var thumbHost = card.querySelector('.improvement-thumb');
      if(p.video){
        var v = document.createElement('video');
        v.src = p.video; v.muted = true; v.setAttribute('playsinline','');
        thumbHost.appendChild(v);
        thumbHost.appendChild(el('<span class="video-badge">▶ VIDEO</span>'));
      } else if(p.image){
        var im = document.createElement('img');
        im.alt = 'Beyond Boundaries';
        im.src = p.image;
        im.onerror = function(){ thumbHost.innerHTML = '<div class="no-media">Photo missing</div>'; };
        thumbHost.appendChild(im);
      } else {
        thumbHost.innerHTML = '<div class="no-media">No media</div>';
      }
      card.addEventListener('click',function(e){
        if(e.target.closest('.improvement-card-actions')) return;
        openDetail(p);
      });
      card.addEventListener('keydown',function(e){
        if(e.target.closest('.improvement-card-actions')) return;
        if(e.key==='Enter'||e.key===' '){e.preventDefault();openDetail(p);}
      });
      bindCardActions(card, p);
      return card;
    }
    function yearOf(p){
      var d = new Date(p.createdAt || Date.now());
      return isNaN(d.getTime()) ? "Unknown" : String(d.getFullYear());
    }
    function paint(){
      var q = (state.bbSearchDept || "").trim().toLowerCase();
      var all = (state.beyondBoundaries||[]).slice().sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);});
      var list = !q ? all : all.filter(function(p){
        return String(p.department||"").toLowerCase().indexOf(q) >= 0;
      });
      if(totalEl) totalEl.textContent = String(list.length);
      if(badge) badge.textContent = list.length + (list.length===1 ? " post" : " posts") + (q ? " · filtered" : "");

      yearsHost.innerHTML = "";
      if(!all.length){
        yearsHost.innerHTML = '<div class="empty-state">No Beyond Boundaries posts have been published yet.</div>';
        return;
      }
      if(!list.length){
        yearsHost.innerHTML = '<div class="empty-state">No posts match this department search.</div>';
        return;
      }
      var byYear = {};
      list.forEach(function(p){
        var y = yearOf(p);
        if(!byYear[y]) byYear[y] = [];
        byYear[y].push(p);
      });
      Object.keys(byYear).sort(function(a,b){ return (b==="Unknown"?-1:parseInt(b,10)) - (a==="Unknown"?-1:parseInt(a,10)); }).forEach(function(y){
        var block = el('<div class="imp-year-block"><div class="imp-year-head"><h4>'+escapeHtml(y)+'</h4><span class="count">'+byYear[y].length+'</span></div><div class="improvement-feed"></div></div>');
        var feed = block.querySelector('.improvement-feed');
        byYear[y].forEach(function(p){ feed.appendChild(makeCard(p)); });
        yearsHost.appendChild(block);
      });
    }

    if(searchInp){
      searchInp.value = state.bbSearchDept || "";
      searchInp.addEventListener('input', function(){
        state.bbSearchDept = searchInp.value;
        paint();
      });
      searchInp.addEventListener('keydown', function(e){ e.stopPropagation(); });
    }
    paint();

    function closeDetail(){overlay.classList.remove('open'); content.innerHTML='';}
    closeBtn.addEventListener('click',closeDetail);
    overlay.addEventListener('click',function(e){if(e.target===overlay)closeDetail();});
    if(overlay._escHandler) document.removeEventListener('keydown', overlay._escHandler);
    overlay._escHandler = function(e){if(e.key==='Escape'&&overlay.classList.contains('open'))closeDetail();};
    document.addEventListener('keydown', overlay._escHandler);
  },0);
  return wrap;
}

function otherFactoryKey(factory, key){
  if(factory==="ABE1") return key;
  return "factory:"+factory+":"+key;
}

async function loadFactorySnapshot(factory){
  var cfgRaw = await storGet(otherFactoryKey(factory, "config"), true);
  var ratingsRaw = await storGet(otherFactoryKey(factory, "ratings"), true);
  var config = null;
  var ratings = {};
  try{ config = cfgRaw ? JSON.parse(cfgRaw) : null; }catch(e){ config = null; }
  try{ ratings = ratingsRaw ? JSON.parse(ratingsRaw) : {}; }catch(e){ ratings = {}; }
  if(!config || !config.departments){
    config = {
      departments: (typeof DEPT_DEFAULTS!=="undefined" ? DEPT_DEFAULTS.map(function(d){ return {id:d[0], name:d[1], champion:"Unassigned", training:0}; }) : []),
      officeDepartments: []
    };
  }
  return { factory: factory, config: config, ratings: ratings };
}

function openPhotoLightbox(src, caption){
  if(!src) return;
  var existing = document.querySelector('.photo-lightbox');
  if(existing) existing.remove();
  var overlay = el(
    '<div class="photo-lightbox" role="dialog" aria-modal="true">'+
      '<div class="lb-inner">'+
        '<button type="button" class="lb-close" aria-label="Close">&times;</button>'+
        '<img src="'+escapeAttr(src)+'" alt="">'+
        (caption ? '<div class="lb-cap">'+escapeHtml(caption)+'</div>' : '')+
      '</div>'+
    '</div>'
  );
  function close(){ if(overlay.parentNode) overlay.parentNode.removeChild(overlay); document.removeEventListener('keydown', onKey); }
  function onKey(e){ if(e.key==='Escape') close(); }
  overlay.addEventListener('click', function(e){ if(e.target===overlay||e.target.classList.contains('lb-close')) close(); });
  overlay.querySelector('.lb-close').addEventListener('click', close);
  document.addEventListener('keydown', onKey);
  document.body.appendChild(overlay);
}

function escapeHtml(s){
  var d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}
function escapeAttr(s){
  return String(s).replace(/"/g,'&quot;');
}

function youtubeEmbedUrl(url){
  if(!url) return "";
  var m = String(url).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/))([A-Za-z0-9_-]{6,})/);
  var id = m ? m[1] : "";
  if(!id) return "";
  return "https://www.youtube.com/embed/"+id+"?autoplay=1&rel=0";
}
function guessResourceType(url, typeHint){
  var t = String(typeHint || "").toLowerCase();
  if(t && t !== "other") return t;
  var u = String(url || "").toLowerCase();
  if(youtubeEmbedUrl(url)) return "video";
  if(u.indexOf("data:video")===0 || /\.(mp4|webm|ogg|mov)(\?|$)/i.test(u)) return "video";
  if(u.indexOf("data:audio")===0 || /\.(mp3|wav|m4a|aac)(\?|$)/i.test(u)) return "mp3";
  if(u.indexOf("data:application\/pdf")===0 || /\.pdf(\?|$)/i.test(u)) return "pdf";
  if(
    u.indexOf("data:application\/vnd.openxmlformats-officedocument.spreadsheetml")===0 ||
    u.indexOf("data:application\/vnd.ms-excel")===0 ||
    u.indexOf("data:text\/csv")===0 ||
    u.indexOf("data:application\/csv")===0 ||
    /\.(xlsx?|csv)(\?|$)/i.test(u)
  ) return "excel";
  if(
    u.indexOf("data:application\/vnd.openxmlformats-officedocument.wordprocessingml")===0 ||
    u.indexOf("data:application\/msword")===0 ||
    /\.(docx?|rtf)(\?|$)/i.test(u)
  ) return "word";
  if(
    u.indexOf("data:application\/vnd.openxmlformats-officedocument.presentationml")===0 ||
    u.indexOf("data:application\/vnd.ms-powerpoint")===0 ||
    /\.(pptx?|ppsx?)(\?|$)/i.test(u)
  ) return "pptx";
  if(u.indexOf("data:text\/plain")===0 || u.indexOf("data:text\/html")===0 || /\.(txt|log|md)(\?|$)/i.test(u)) return "text";
  if(u.indexOf("data:image")===0 || /\.(png|jpe?g|gif|webp|svg)(\?|$)/i.test(u)) return "image";
  if(/canva\.com/i.test(u)) return "canva";
  return "other";
}
function officeEmbedUrl(url){
  if(!url || String(url).indexOf("data:")===0) return "";
  try{
    return "https://view.officeapps.live.com/op/embed.aspx?src="+encodeURIComponent(url);
  }catch(e){ return ""; }
}
function googleDocEmbedUrl(url){
  if(!url || String(url).indexOf("data:")===0) return "";
  try{
    return "https://docs.google.com/gview?embedded=1&url="+encodeURIComponent(url);
  }catch(e){ return ""; }
}

var __viewerScriptCache = {};
function loadViewerScript(src){
  return new Promise(function(resolve, reject){
    if(__viewerScriptCache[src] === "loaded"){ resolve(); return; }
    if(__viewerScriptCache[src] && __viewerScriptCache[src].then){
      __viewerScriptCache[src].then(resolve, reject); return;
    }
    var p = new Promise(function(res, rej){
      var sc = document.createElement("script");
      sc.src = src;
      sc.async = true;
      sc.onload = function(){ __viewerScriptCache[src] = "loaded"; res(); };
      sc.onerror = function(){ delete __viewerScriptCache[src]; rej(new Error("Failed to load "+src)); };
      document.head.appendChild(sc);
    });
    __viewerScriptCache[src] = p;
    p.then(resolve, reject);
  });
}
function loadViewerScriptAny(urls){
  var i = 0;
  function next(){
    if(i >= urls.length) return Promise.reject(new Error("Could not load required preview library. Check your internet connection."));
    var u = urls[i++];
    return loadViewerScript(u).catch(function(){ return next(); });
  }
  return next();
}

function excelColorToCss(color){
  if(!color) return "";
  if(typeof color === "string"){
    var s = color.replace(/^#/,"");
    if(/^([0-9a-fA-F]{6}|[0-9a-fA-F]{8})$/.test(s)){
      if(s.length===8) return "rgba("+parseInt(s.slice(2,4),16)+","+parseInt(s.slice(4,6),16)+","+parseInt(s.slice(6,8),16)+","+(parseInt(s.slice(0,2),16)/255)+")";
      return "#"+s;
    }
    return "";
  }
  if(color.argb){
    var a = color.argb;
    if(a.length===8){
      var ai = parseInt(a.slice(0,2),16)/255;
      var r = parseInt(a.slice(2,4),16);
      var g = parseInt(a.slice(4,6),16);
      var b = parseInt(a.slice(6,8),16);
      if(ai >= 0.99) return "rgb("+r+","+g+","+b+")";
      return "rgba("+r+","+g+","+b+","+ai+")";
    }
    if(a.length===6) return "#"+a;
  }
  if(color.theme != null){
    // approximate theme colors used in many corporate sheets
    var theme = ["#000000","#FFFFFF","#1F497D","#EEECE1","#4F81BD","#C0504D","#9BBB59","#8064A2","#4BACC6","#F79646"];
    var base = theme[color.theme] || "#000000";
    return base;
  }
  if(color.indexed != null){
    var indexed = {0:"#000000",1:"#FFFFFF",2:"#FF0000",3:"#00FF00",4:"#0000FF",5:"#FFFF00",6:"#FF00FF",7:"#00FFFF",8:"#000000",9:"#FFFFFF",10:"#FF0000",11:"#00FF00",12:"#0000FF",13:"#FFFF00",14:"#FF00FF",15:"#00FFFF",16:"#800000",17:"#008000",18:"#000080",19:"#808000",20:"#800080",21:"#008080",22:"#C0C0C0",23:"#808080",24:"#9999FF",25:"#993366",26:"#FFFFCC",27:"#CCFFFF",28:"#660066",29:"#FF8080",30:"#0066CC",31:"#CCCCFF",32:"#000080",33:"#FF00FF",34:"#FFFF00",35:"#00FFFF",36:"#800080",37:"#800000",38:"#008080",39:"#0000FF",40:"#00CCFF",41:"#CCFFFF",42:"#CCFFCC",43:"#FFFF99",44:"#99CCFF",45:"#FF99CC",46:"#CC99FF",47:"#FFCC99",48:"#3366FF",49:"#33CCCC",50:"#99CC00",51:"#FFCC00",52:"#FF9900",53:"#FF6600",54:"#666699",55:"#969696",56:"#003366",57:"#339966",58:"#003300",59:"#333300",60:"#993300",61:"#993366",62:"#333399",63:"#333333",64:"#000000"};
    return indexed[color.indexed] || "";
  }
  return "";
}
function excelBorderToCss(border){
  if(!border || !border.style || border.style === "none") return "";
  var col = excelColorToCss(border.color) || "#b0b0b0";
  var w = "1px";
  if(border.style === "medium" || border.style === "mediumDashed") w = "2px";
  if(border.style === "thick") w = "3px";
  var style = "solid";
  if(/dash/i.test(border.style||"")) style = "dashed";
  if(/dot/i.test(border.style||"")) style = "dotted";
  if(/double/i.test(border.style||"")) style = "double";
  return w+" "+style+" "+col;
}
function cellValueToText(val){
  if(val == null || val === "") return "";
  if(typeof val === "object"){
    if(val.richText && val.richText.length){
      return val.richText.map(function(p){ return p.text || ""; }).join("");
    }
    if(val.text != null) return String(val.text);
    if(val.result != null) return String(val.result);
    if(val.formula != null && val.result != null) return String(val.result);
    if(val instanceof Date) return val.toLocaleDateString();
    try{ return String(val); }catch(e){ return ""; }
  }
  return String(val);
}

async function renderExcelInModal(modal, url, title){
  var host = el('<div class="doc-preview-scroll excel-rich-host"><p style="color:#64748b;">Opening spreadsheet with original layout…</p></div>');
  modal.appendChild(host);
  appendDownloadBar(modal, url, title, "Original spreadsheet view (read-only)");
  try{
    await loadExcelJSLib();
    if(typeof ExcelJS === "undefined") throw new Error("Excel library not available");
    var ab = await dataUrlToArrayBuffer(url);
    var wb = new ExcelJS.Workbook();
    await wb.xlsx.load(ab);
    var sheets = wb.worksheets || [];
    if(!sheets.length) throw new Error("No sheets found");

    var tabs = el('<div class="doc-sheet-tabs"></div>');
    var sheetHost = el('<div class="excel-sheet-wrap"></div>');
    host.innerHTML = "";
    host.appendChild(sheetHost);

    function renderSheet(ws){
      sheetHost.innerHTML = "";
      var merges = {};
      (ws.model && ws.model.merges ? ws.model.merges : []).forEach(function(m){
        // m like "A1:C2"
        try{
          var range = ws.getCell(m.split(":")[0]);
        }catch(e){}
      });
      // Build merge map from worksheet._merges or model
      var mergeMap = {}; // "r,c" -> {rowspan, colspan, master}
      var skip = {};
      try{
        var mergeCells = [];
        if(ws._merges){
          Object.keys(ws._merges).forEach(function(k){
            var mm = ws._merges[k];
            if(mm && mm.top != null) mergeCells.push(mm);
          });
        } else if(ws.model && ws.model.merges){
          ws.model.merges.forEach(function(addr){
            try{
              var parts = String(addr).split(":");
              var a = ws.getCell(parts[0]);
              var b = ws.getCell(parts[1] || parts[0]);
              mergeCells.push({top:a.row, left:a.col, bottom:b.row, right:b.col});
            }catch(e){}
          });
        }
        mergeCells.forEach(function(m){
          var rs = m.bottom - m.top + 1;
          var cs = m.right - m.left + 1;
          mergeMap[m.top+","+m.left] = {rowspan:rs, colspan:cs};
          for(var r=m.top;r<=m.bottom;r++){
            for(var c=m.left;c<=m.right;c++){
              if(r===m.top && c===m.left) continue;
              skip[r+","+c] = true;
            }
          }
        });
      }catch(e){}

      var dim = ws.dimensions || { top:1, left:1, bottom: Math.max(ws.rowCount||1,1), right: Math.max(ws.columnCount||1,1) };
      var r0 = dim.top || 1;
      var r1 = dim.bottom || ws.rowCount || 1;
      var c0 = dim.left || 1;
      var c1 = dim.right || ws.columnCount || 1;
      // safety cap for huge sheets
      if(r1 - r0 > 400) r1 = r0 + 400;
      if(c1 - c0 > 60) c1 = c0 + 60;

      var table = document.createElement("table");
      table.className = "excel-rich-table";
      var colgroup = document.createElement("colgroup");
      for(var c=c0;c<=c1;c++){
        var col = document.createElement("col");
        var colObj = ws.getColumn(c);
        var wch = (colObj && colObj.width) ? colObj.width : 10;
        col.style.width = Math.max(32, Math.round(wch * 8.2)) + "px";
        colgroup.appendChild(col);
      }
      table.appendChild(colgroup);
      var tbody = document.createElement("tbody");

      for(var r=r0;r<=r1;r++){
        var tr = document.createElement("tr");
        var row = ws.getRow(r);
        var rh = row && row.height ? row.height : 18;
        tr.style.height = Math.max(18, Math.round(rh * 1.25)) + "px";
        for(var c=c0;c<=c1;c++){
          if(skip[r+","+c]) continue;
          var cell = ws.getCell(r, c);
          var td = document.createElement("td");
          var merge = mergeMap[r+","+c];
          if(merge){
            if(merge.rowspan > 1) td.rowSpan = merge.rowspan;
            if(merge.colspan > 1) td.colSpan = merge.colspan;
          }
          var text = cellValueToText(cell.value);
          td.textContent = text;

          // alignment
          var align = (cell.alignment && cell.alignment.horizontal) || "general";
          if(align === "center" || align === "centre") td.style.textAlign = "center";
          else if(align === "right") td.style.textAlign = "right";
          else if(align === "left") td.style.textAlign = "left";
          if(cell.alignment && cell.alignment.vertical){
            td.style.verticalAlign = cell.alignment.vertical === "middle" ? "middle" : cell.alignment.vertical;
          } else {
            td.style.verticalAlign = "middle";
          }
          if(cell.alignment && cell.alignment.wrapText) td.style.whiteSpace = "pre-wrap";

          // font
          if(cell.font){
            if(cell.font.bold) td.style.fontWeight = "700";
            if(cell.font.italic) td.style.fontStyle = "italic";
            if(cell.font.size) td.style.fontSize = cell.font.size + "px";
            if(cell.font.color){
              var fc = excelColorToCss(cell.font.color);
              if(fc) td.style.color = fc;
            }
            if(cell.font.name) td.style.fontFamily = cell.font.name + ", Inter, Arial, sans-serif";
          }

          // fill
          if(cell.fill && cell.fill.type === "pattern" && cell.fill.pattern !== "none"){
            var bg = excelColorToCss(cell.fill.fgColor) || excelColorToCss(cell.fill.bgColor);
            if(bg) td.style.background = bg;
          }

          // borders
          if(cell.border){
            if(cell.border.top){ var bt = excelBorderToCss(cell.border.top); if(bt) td.style.borderTop = bt; }
            if(cell.border.left){ var bl = excelBorderToCss(cell.border.left); if(bl) td.style.borderLeft = bl; }
            if(cell.border.bottom){ var bb = excelBorderToCss(cell.border.bottom); if(bb) td.style.borderBottom = bb; }
            if(cell.border.right){ var br = excelBorderToCss(cell.border.right); if(br) td.style.borderRight = br; }
          }

          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }
      table.appendChild(tbody);
      sheetHost.appendChild(table);
    }

    sheets.forEach(function(ws, idx){
      var name = ws.name || ("Sheet"+(idx+1));
      var b = el('<button type="button" data-idx="'+idx+'">'+escapeHtml(name)+'</button>');
      if(idx===0) b.classList.add("active");
      b.addEventListener("click", function(){
        tabs.querySelectorAll("button").forEach(function(x){ x.classList.remove("active"); });
        b.classList.add("active");
        renderSheet(ws);
      });
      tabs.appendChild(b);
    });
    modal.insertBefore(tabs, host);
    renderSheet(sheets[0]);
  }catch(err){
    // Fallback to SheetJS plain table if ExcelJS fails
    try{
      await loadXlsxLib();
      var ab2 = await dataUrlToArrayBuffer(url);
      var wb2 = XLSX.read(new Uint8Array(ab2), { type: "array", cellStyles: true });
      var names = wb2.SheetNames || [];
      host.innerHTML = "";
      if(!names.length) throw err;
      var html = XLSX.utils.sheet_to_html(wb2.Sheets[names[0]]);
      host.innerHTML = html;
      var tip = el('<p style="font-size:12px;color:#64748b;margin-top:8px;">Basic fallback view (full colors need ExcelJS). Error: '+escapeHtml(err && err.message || "")+'</p>');
      host.appendChild(tip);
    }catch(err2){
      host.innerHTML = "";
      host.appendChild(el('<p><b>Could not open this spreadsheet with original layout.</b></p>'));
      host.appendChild(el('<p style="font-size:12px;color:#64748b;">'+escapeHtml((err && err.message) || (err2 && err2.message) || "Preview error")+'</p>'));
      host.appendChild(el('<p style="font-size:12px;color:#64748b;">Use Download / Save to open in Microsoft Excel for the exact desktop view.</p>'));
    }
  }
}

async function renderPptxInModal(modal, url, title){
  var host = el('<div class="doc-preview-scroll"><p style="color:#64748b;">Opening presentation in the platform…</p></div>');
  modal.appendChild(host);
  appendDownloadBar(modal, url, title, "Presentation text opened in-platform");
  try{
    await loadJsZipLib();
    if(typeof JSZip === "undefined") throw new Error("ZIP library not available");
    var ab = await dataUrlToArrayBuffer(url);
    var zip = await JSZip.loadAsync(ab);
    var slideFiles = Object.keys(zip.files).filter(function(n){
      return /^ppt\/slides\/slide\d+\.xml$/i.test(n);
    }).sort(function(a,b){
      var na = parseInt((a.match(/slide(\d+)/i)||[])[1]||"0",10);
      var nb = parseInt((b.match(/slide(\d+)/i)||[])[1]||"0",10);
      return na - nb;
    });
    if(!slideFiles.length) throw new Error("No slides found in this file");
    host.innerHTML = "";
    for(var i=0;i<slideFiles.length;i++){
      var xml = await zip.files[slideFiles[i]].async("string");
      var texts = [];
      xml.replace(/<a:t[^>]*>([\s\S]*?)<\/a:t>/g, function(_, t){
        var cleaned = t.replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&").replace(/&quot;/g,'"').trim();
        if(cleaned) texts.push(cleaned);
        return _;
      });
      var slide = el('<div class="doc-pptx-slide"></div>');
      slide.appendChild(el('<h4>Slide '+(i+1)+'</h4>'));
      if(texts.length){
        texts.forEach(function(line){
          slide.appendChild(el('<p>'+escapeHtml(line)+'</p>'));
        });
      } else {
        slide.appendChild(el('<p style="color:#94a3b8;">(No readable text on this slide)</p>'));
      }
      host.appendChild(slide);
    }
  }catch(err){
    host.innerHTML = "";
    host.appendChild(el('<p><b>Could not open this PowerPoint inside the platform.</b></p>'));
    host.appendChild(el('<p style="font-size:12px;color:#64748b;">'+(err && err.message ? escapeHtml(err.message) : "Preview error")+'</p>'));
  }
}

/** Always open & read files inside the platform (Excel/Word/PPT/PDF/images/video). */
function openInAppViewer(url, title, typeHint){
  if(!url){ alert("No file or link available."); return; }
  var existing = document.getElementById("video-player-overlay");
  if(existing) existing.remove();
  var type = guessResourceType(url, typeHint);
  var overlay = el('<div class="video-player-overlay" id="video-player-overlay"></div>');
  var isDoc = (type !== "video" && type !== "mp3" && type !== "image");
  var modal = el('<div class="video-player-modal'+(isDoc?' video-player-doc':'')+'" role="dialog" aria-modal="true"></div>');
  var closeBtn = el('<button type="button" class="video-player-close" aria-label="Close">&times;</button>');
  modal.appendChild(closeBtn);
  if(title) modal.appendChild(el('<div class="video-player-title">'+escapeHtml(title||"")+'</div>'));

  function addFallback(msg){
    var box = el('<div class="doc-fallback"></div>');
    box.appendChild(el('<p>'+escapeHtml(msg||"This file cannot be previewed here.")+'</p>'));
    var dl = el('<button type="button" class="btn primary">Download / Save</button>');
    dl.addEventListener("click", function(){ triggerDownloadUrl(url, title); });
    box.appendChild(dl);
    modal.appendChild(box);
  }

  if(type === "video"){
    var embed = youtubeEmbedUrl(url);
    if(embed){
      modal.appendChild(el('<iframe src="'+escapeAttr(embed)+'" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>'));
    } else {
      var v = document.createElement("video");
      v.controls = true; v.autoplay = true; v.setAttribute("playsinline","");
      v.src = url;
      modal.appendChild(v);
    }
  } else if(type === "mp3"){
    var a = document.createElement("audio");
    a.controls = true; a.autoplay = true; a.src = url;
    modal.appendChild(a);
  } else if(type === "image"){
    var im = document.createElement("img");
    im.className = "doc-image"; im.alt = title||"Image"; im.src = url;
    modal.appendChild(im);
  } else if(type === "pdf"){
    var pdfFrame = document.createElement("iframe");
    pdfFrame.className = "doc-frame";
    pdfFrame.title = title||"PDF";
    pdfFrame.src = url;
    modal.appendChild(pdfFrame);
    appendDownloadBar(modal, url, title, "PDF opened in-platform");
  } else if(type === "excel"){
    // Always read on-platform (works for uploaded files + most links)
    renderExcelInModal(modal, url, title);
  } else if(type === "word"){
    renderWordInModal(modal, url, title);
  } else if(type === "pptx"){
    renderPptxInModal(modal, url, title);
  } else if(type === "text"){
    renderTextInModal(modal, url, title);
  } else {
    if(String(url).indexOf("http")===0){
      var fr3 = document.createElement("iframe");
      fr3.className = "doc-frame";
      fr3.src = url;
      fr3.setAttribute("sandbox", "allow-scripts allow-same-origin allow-popups allow-forms");
      modal.appendChild(fr3);
      appendDownloadBar(modal, url, title, "Opened in-platform when the site allows embedding");
    } else if(String(url).indexOf("data:")===0){
      // Unknown uploaded binary — try excel then text
      renderExcelInModal(modal, url, title);
    } else {
      addFallback("This resource cannot be shown inside the platform.");
    }
  }

  overlay.appendChild(modal);
  document.body.appendChild(overlay);
  requestAnimationFrame(function(){ overlay.classList.add("open"); });
  function close(){
    overlay.classList.remove("open");
    try{
      var vid = modal.querySelector("video");
      if(vid){ vid.pause(); vid.removeAttribute("src"); vid.load(); }
      var aud = modal.querySelector("audio");
      if(aud){ aud.pause(); aud.removeAttribute("src"); }
      modal.querySelectorAll("iframe").forEach(function(f){ f.src = "about:blank"; });
    }catch(e){}
    setTimeout(function(){ if(overlay.parentNode) overlay.parentNode.removeChild(overlay); }, 120);
    document.removeEventListener("keydown", onKey);
  }
  function onKey(e){ if(e.key === "Escape") close(); }
  closeBtn.addEventListener("click", close);
  overlay.addEventListener("click", function(e){ if(e.target === overlay) close(); });
  document.addEventListener("keydown", onKey);
}
function openVideoPlayer(mediaUrl, title){
  openInAppViewer(mediaUrl, title, "video");
}

function weekBounds(offsetWeeks){
  var now = new Date();
  var day = now.getDay(); // 0 sun...6 sat
  var diffToMonday = (day===0? -6 : 1-day);
  var monday = new Date(now); monday.setDate(now.getDate()+diffToMonday+ (offsetWeeks*7));
  var sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
  return { start: isoDate(monday), end: isoDate(sunday) };
}


/** ISO week number (1-53) and ISO week-year for YYYY-MM-DD */
function isoWeekParts(dateStr){
  var d = new Date(dateStr+"T00:00:00");
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
  var week1 = new Date(d.getFullYear(), 0, 4);
  var week = 1 + Math.round(((d - week1) / 86400000 - 3 + ((week1.getDay() + 6) % 7)) / 7);
  return { year: d.getFullYear(), week: week };
}

/** Monday–Sunday for ISO week in week-year */
function rangeFromIsoWeek(year, week){
  year = parseInt(year,10); week = parseInt(week,10);
  var jan4 = new Date(year, 0, 4);
  var day = jan4.getDay() || 7;
  var monday = new Date(jan4);
  monday.setDate(jan4.getDate() - (day - 1) + (week - 1) * 7);
  var sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  return { start: isoDate(monday), end: isoDate(sunday), week: week, year: year };
}

function listRecentIsoWeeks(count){
  count = count || 60;
  var out = [];
  var d = new Date();
  var day = d.getDay();
  var diff = (day===0 ? -6 : 1-day);
  d.setDate(d.getDate()+diff);
  for(var i=0;i<count;i++){
    var start = isoDate(d);
    var parts = isoWeekParts(start);
    var endD = new Date(d); endD.setDate(d.getDate()+6);
    out.push({
      year: parts.year, week: parts.week, start: start, end: isoDate(endD),
      label: "Week "+parts.week+" · "+parts.year
    });
    d.setDate(d.getDate()-7);
  }
  return out;
}

/** Offset (weeks from current week) for a given ISO year+week */
function weekOffsetFromIso(year, week){
  var cur = weekBounds(0);
  var tgt = rangeFromIsoWeek(year, week);
  var c = new Date(cur.start+"T00:00:00");
  var t = new Date(tgt.start+"T00:00:00");
  return Math.round((t - c) / (7*86400000));
}

function weeksInIsoYear(year){
  return isoWeekParts(year+"-12-28").week;
}

/**
 * Compact week calendar box: Year + Week 1..N dropdowns.
 * onPick(year, week, range) when user chooses.
 */
function buildWeekCalendarBox(selectedYear, selectedWeek, onPick){
  selectedYear = parseInt(selectedYear,10) || new Date().getFullYear();
  selectedWeek = parseInt(selectedWeek,10) || 1;
  var box = el('<div class="week-cal-box" role="group" aria-label="Choose week"></div>');
  box.appendChild(el('<div class="week-cal-title">Choose week</div>'));
  var row = el('<div class="week-cal-row"></div>');

  var yNow = new Date().getFullYear();
  var ySel = el('<select class="week-cal-year" aria-label="Year"></select>');
  for(var y=yNow+1; y>=yNow-5; y--){
    var o = document.createElement("option");
    o.value = String(y);
    o.textContent = String(y);
    if(y === selectedYear) o.selected = true;
    ySel.appendChild(o);
  }

  var wSel = el('<select class="week-cal-week" aria-label="Week number"></select>');
  function fillWeeks(year, keepWeek){
    wSel.innerHTML = "";
    var maxW = weeksInIsoYear(year) || 52;
    for(var w=1; w<=maxW; w++){
      var rng = rangeFromIsoWeek(year, w);
      var o = document.createElement("option");
      o.value = String(w);
      o.textContent = "Week "+w+"  ("+rng.start+" \u2192 "+rng.end+")";
      if(w === keepWeek) o.selected = true;
      wSel.appendChild(o);
    }
    if(!wSel.value) wSel.value = "1";
  }
  fillWeeks(selectedYear, selectedWeek);

  var goBtn = el('<button type="button" class="btn small primary week-cal-go">Show data</button>');
  function emit(){
    var year = parseInt(ySel.value,10);
    var week = parseInt(wSel.value,10);
    var rng = rangeFromIsoWeek(year, week);
    if(typeof onPick === "function") onPick(year, week, rng);
  }
  ySel.addEventListener("change", function(){
    var year = parseInt(ySel.value,10);
    var curW = parseInt(wSel.value,10) || 1;
    var maxW = weeksInIsoYear(year) || 52;
    fillWeeks(year, Math.min(curW, maxW));
  });
  goBtn.addEventListener("click", emit);
  wSel.addEventListener("change", emit);

  var yWrap = el('<label class="week-cal-field"><span>Year</span></label>');
  yWrap.appendChild(ySel);
  var wWrap = el('<label class="week-cal-field"><span>Week</span></label>');
  wWrap.appendChild(wSel);
  row.appendChild(yWrap);
  row.appendChild(wWrap);
  row.appendChild(goBtn);
  box.appendChild(row);

  var chips = el('<div class="week-cal-chips"></div>');
  listRecentIsoWeeks(8).forEach(function(w){
    var active = (w.year===selectedYear && w.week===selectedWeek);
    var b = el('<button type="button" class="week-cal-chip'+(active?' active':'')+'">W'+w.week+'</button>');
    b.title = w.label+" · "+w.start+" \u2192 "+w.end;
    b.addEventListener("click", function(){
      ySel.value = String(w.year);
      fillWeeks(w.year, w.week);
      if(typeof onPick === "function") onPick(w.year, w.week, w);
    });
    chips.appendChild(b);
  });
  box.appendChild(chips);
  return box;
}

function isKaizenImplemented(k){
  if(!k) return false;
  if(k.after_video) return true;
  if(k.after && k.after.some(function(p){ return (p && (p.image || (p.text||'').trim())); })) return true;
  return false;
}
function kaizenPeriodRange(period){
  var today = todayStr();
  if(!state.kzMonth) state.kzMonth = today.slice(0,7);
  if(!state.kzYear) state.kzYear = today.slice(0,4);
  if(state.kzWeekNum==null || state.kzWeekYear==null){
    try{
      var iso = (typeof isoWeekParts==='function') ? isoWeekParts(today) : null;
      if(iso){ state.kzWeekNum = iso.week; state.kzWeekYear = iso.year; }
      else {
        var wb = weekBounds(0);
        state.kzWeekNum = 1; state.kzWeekYear = parseInt(today.slice(0,4),10);
      }
    }catch(e){
      state.kzWeekNum = 1; state.kzWeekYear = parseInt(today.slice(0,4),10);
    }
  }
  var rangeStart, rangeEnd, periodLabel;
  if(period==="today"){
    rangeStart = rangeEnd = today;
    periodLabel = "Today — "+today;
  } else if(period==="week"){
    var wb = rangeFromIsoWeek(state.kzWeekYear, state.kzWeekNum);
    rangeStart = wb.start; rangeEnd = wb.end;
    periodLabel = "Week "+state.kzWeekNum+" · "+state.kzWeekYear+" ("+rangeStart+" → "+rangeEnd+")";
  } else if(period==="month"){
    var ym = state.kzMonth;
    rangeStart = ym+"-01";
    var d = new Date(rangeStart+"T00:00:00");
    var lastDay = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    rangeEnd = ym+"-"+("0"+lastDay).slice(-2);
    periodLabel = monthLabel(ym);
  } else {
    var y = String(state.kzYear);
    rangeStart = y+"-01-01"; rangeEnd = y+"-12-31";
    periodLabel = "Year "+y;
  }
  return { start: rangeStart, end: rangeEnd, label: periodLabel };
}
function filterKaizensInRange(list, start, end){
  return (list||[]).filter(function(k){ return k && k.date && k.date>=start && k.date<=end; });
}
function summarizeKaizens(list){
  var done=0, proposal=0, staff=0, gr=0, money=0;
  var types = { ONGOING:0, ECRS:0, SGA:0, MIP:0 };
  (list||[]).forEach(function(k){
    if(isKaizenImplemented(k)) done++; else proposal++;
    if(k.person_class==="staff") staff++;
    if(k.person_class==="gr") gr++;
    money += parseFloat(k.money_in_bank)||0;
    var t = String(k.kaizen_type||"ONGOING").toUpperCase();
    if(!types.hasOwnProperty(t)) t = "ONGOING";
    types[t]++;
  });
  return { total: (list||[]).length, done: done, proposal: proposal, staff: staff, gr: gr, money: money, types: types };
}
async function loadFactoryKaizens(factory){
  var raw = await storGet(otherFactoryKey(factory, "kaizens"), true);
  var list = [];
  try{ list = raw ? JSON.parse(raw) : []; }catch(e){ list = []; }
  if(!Array.isArray(list)) list = [];
  return list;
}

function renderAdminSharing(scope, title){
  scope = scope || '5s'; title = title || '5S';
  var panel=el(''+
    '<div class="admin-panel">'+
      '<h3>Share a '+title+' Update</h3>'+
      '<div class="field-row"><label>Your message</label><textarea id="share-text-'+scope+'" rows="4" placeholder="Write your '+title+' update\u2026"></textarea></div>'+
      '<div class="field-row"><label>Photo</label><div class="camera-row"><input type="file" id="share-photo-'+scope+'" accept="image/*"></div></div>'+
      '<div class="field-row"><label>Video</label><div class="camera-row"><input type="file" id="share-video-'+scope+'" accept="video/*"></div></div>'+
      '<button class="btn primary" id="publish-share-'+scope+'">Publish Sharing</button>'+
    '</div>'
  );
  setTimeout(function(){
    var publishBtn = document.getElementById('publish-share-'+scope);
    if(!publishBtn) return; // panel was replaced before this ran (e.g. user switched tabs)
    publishBtn.addEventListener('click',async function(){
      var text=document.getElementById('share-text-'+scope).value.trim();
      var pf=document.getElementById('share-photo-'+scope).files[0];
      var vf=document.getElementById('share-video-'+scope).files[0];
      var image='', video='';
      if(vf){
        if(vf.size > 4.5*1024*1024){ if(!confirm('This video is quite large and may fail to save. Continue anyway?')) return; }
        video = await fileToDataUrl(vf);
      } else if(pf){
        image = await fileToDataUrl(pf);
      }
      if(!text && !image && !video) return;
      var record = {id:'share_'+Date.now(),text:text,image:image,video:video,createdAt:Date.now(),likes:[],hearts:[],happies:[],comments:[]};
      if(scope==='kaizen'){ state.kaizenShares.push(record); await saveKaizenShares(); }
      else { state.shares.push(record); await saveShares(); }
      alert('Sharing published.');
      render();
    });
  },0);
  return panel;
}

        outlookEmail:(document.getElementById('live-outlook-email')||{}).value ? document.getElementById('live-outlook-email').value.trim() : '',
        whatsapp:(document.getElementById('live-whatsapp')||{}).value ? document.getElementById('live-whatsapp').value.trim() : '',
        status:'scheduled'
      };
    }

    document.getElementById('schedule-live').onclick=async function(){
      var selected=selectedLocations();
      if(!selected.length){ alert('Please select at least one department or office.'); return; }
      state.liveAudit=values();
      await saveLiveAudit();
      alert('Live audit scheduled for '+selected.length+' location'+(selected.length>1?'s':'')+'.');
      render();
    };

    document.getElementById('start-live').onclick=async function(){
      var selected=selectedLocations();
      if(!selected.length){ alert('Please select at least one department or office.'); return; }
      state.liveAudit=values();
      state.liveAudit.status='live';
      await saveLiveAudit();
      var v=document.getElementById('admin-live-video');
      try{
        var stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:true});
        v.srcObject=stream;
        v.style.display='block';
      }catch(e){
        alert('Camera access was not available. The live can still use the public embed link.');
      }
      render();
    };

    document.getElementById('pause-live').onclick=async function(){
      if(!state.liveAudit) return;
      state.liveAudit.status = (state.liveAudit.status==='paused') ? 'live' : 'paused';
      await saveLiveAudit();
      render();
    };

    document.getElementById('stop-live').onclick=async function(){
      if(state.liveAudit){
        state.liveAudit.status='ended';
        state.liveAudit.scheduled=false;
        await saveLiveAudit();
      }
      render();
    };
  },0);

  return panel;
}

function renderAdminDetail(opts){
  opts = opts || {};
  var scope = opts.scope || "floor"; // floor | office
  var deptsList = opts.departments || (scope==="office" ? (state.config.officeDepartments||[]) : (state.config.departments||[]));
  var loadFn = opts.loadFn || (scope==="office" ? loadOfficeDeptDetail : loadDeptDetail);
  var saveFn = opts.saveFn || (scope==="office" ? saveOfficeDeptDetail : saveDeptDetail);
  var selId = "detail-dept-sel-"+scope;
  var hostId = "detail-editor-host-"+scope;
  var title = scope==="office" ? "Office Comments &amp; Photos per Department" : "Comments &amp; Photos per Department";

  var panel = el('<div class="admin-panel"></div>');
  panel.appendChild(el('<h3>'+title+'</h3>'));

  var deptOpts = deptsList.map(function(d){return '<option value="'+d.id+'">'+d.name+'</option>';}).join("");
  if(!deptOpts) deptOpts = '<option value="">No departments configured</option>';
  var selRow = el('<div class="field-row"><label>Department</label><select id="'+selId+'">'+deptOpts+'</select></div>');
  if(parts==="photos"){
    // Department is chosen in the Comments panel above; keep a hidden select for sync/load.
    selRow.style.display = "none";
  }
  panel.appendChild(selRow);

  var host = el('<div id="'+hostId+'"></div>');
  panel.appendChild(host);

  function loadEditor(deptId){
    if(!deptId){ host.innerHTML = '<div class="note">No department selected.</div>'; return; }
    host.innerHTML = '<div class="note">Loading\u2026</div>';
    loadFn(deptId).then(function(detail){
      detail.worstPhotos = (detail.worstPhotos || []).slice(0,5);
      detail.bestPhotos = (detail.bestPhotos || []).slice(0,5);
      host.innerHTML = "";

      if(!detail.highlightComments) detail.highlightComments=[];
      var showComments = (parts==="all" || parts==="comments");
      var showPhotos = (parts==="all" || parts==="photos");

      // Lowlights + Highlights side by side
      var commentsAdminSplit = el('<div class="audit-comments-split comments-block" style="margin-top:10px;"></div>');
      var lowCol = el('<div></div>');
      var highCol = el('<div></div>');

      lowCol.appendChild(el('<h4 style="font-size:13px;margin:8px 0;text-transform:uppercase;letter-spacing:.05em;color:var(--red);">Audit Comments — Lowlights (max 6)</h4>'));
      var cWrap = el('<div id="c-wrap"></div>');
      function renderComments(){
        cWrap.innerHTML="";
        detail.comments.forEach(function(c,i){
          var r = el('<div class="field-row"><textarea data-cidx="'+i+'" rows="1">'+escapeHtml(c)+'</textarea><button class="btn small danger" data-cdel="'+i+'">Remove</button></div>');
          cWrap.appendChild(r);
        });
        if(detail.comments.length<6){
          var addBtn = el('<button class="btn small">+ Add lowlight</button>');
          addBtn.addEventListener("click", function(){ detail.comments.push(""); renderComments(); });
          cWrap.appendChild(addBtn);
        }

  setTimeout(function(){
    var sel = document.getElementById(selId);

    // Keep floor/office department selection in sync across comments + photos panels
    var syncKey = "adminDetailDept_"+scope;
    if(state[syncKey] && Array.prototype.some.call(sel.options, function(o){ return o.value===state[syncKey]; })){
      sel.value = state[syncKey];
    }
    sel.addEventListener("change", function(){
      if(sel.getAttribute("data-syncing")==="1"){
        loadEditor(sel.value);
        return;
      }
      state[syncKey] = sel.value;
      loadEditor(sel.value);
      var otherParts = parts==="comments" ? "photos" : (parts==="photos" ? "comments" : null);
      if(otherParts){
        var otherSel = document.getElementById("detail-dept-sel-"+scope+"-"+otherParts);

          otherSel.setAttribute("data-syncing","1");

          otherSel.removeAttribute("data-syncing");
        }
      }
    });
    loadEditor(sel.value);
  },0);

          '<textarea rows="2" data-'+kind+'txt="'+i+'" placeholder="Description">'+escapeHtml(p.text)+'</textarea>'+
          '<input type="file" accept="image/*" data-'+kind+'file="'+i+'" title="Photo from gallery or camera">'+
          (p.image ? '<span class="note" style="width:100%;">Photo attached \u2713</span>' : '')+
          '<button type="button" class="btn small danger" data-'+kind+'del="'+i+'">Remove</button>'+
        '</div>'
      );
      container.appendChild(row);
    });
    if(arr.length<5){
      var addBtn = el('<button type="button" class="btn small">+ Add point</button>');
      addBtn.addEventListener("click", function(){
        // preserve text currently typed
        container.querySelectorAll("textarea[data-"+kind+"txt]").forEach(function(ta){
          var ix = parseInt(ta.getAttribute("data-"+kind+"txt"),10);
          if(arr[ix]) arr[ix].text = ta.value;
        });
        arr.push({text:"",image:""});
        renderPoints(container,arr,kind);
      });
      container.appendChild(addBtn);
    }
    container.querySelectorAll("[data-"+kind+"del]").forEach(function(b){
      b.addEventListener("click", function(){
        container.querySelectorAll("textarea[data-"+kind+"txt]").forEach(function(ta){
          var ix = parseInt(ta.getAttribute("data-"+kind+"txt"),10);
          if(arr[ix]) arr[ix].text = ta.value;
        });
        arr.splice(parseInt(b.getAttribute("data-"+kind+"del"),10),1);
        if(!arr.length) arr.push({text:"",image:""});
        renderPoints(container,arr,kind);
      });
    });
  }
  renderPoints(beforeWrap, f.before, "b");
  renderPoints(afterWrap, f.after, "a");

  var saveBtn = el('<button type="button" class="btn primary" style="margin-top:14px;">Save Kaizen</button>');
  var cancelEditBtn = el('<button type="button" class="btn small" style="margin-top:14px;margin-left:8px;display:none;">Cancel edit</button>');
  var msg = el('<span class="save-msg" style="display:none;">Kaizen saved.</span>');
  var btnRow = el('<div style="display:flex;align-items:center;flex-wrap:wrap;gap:4px;"></div>');
  btnRow.appendChild(saveBtn); btnRow.appendChild(cancelEditBtn); btnRow.appendChild(msg);
  panel.appendChild(btnRow);
  cancelEditBtn.addEventListener("click", function(){ resetForm(); msg.style.display="none"; });

  panel.appendChild(el('<h3 style="margin-top:30px;">Existing Kaizens</h3>'));
  var existingWrap = el('<div></div>');
  function renderExisting(){
    existingWrap.innerHTML = "";
    if(state.kaizens.length===0){
      existingWrap.appendChild(el('<div class="note">No Kaizens recorded yet.</div>'));
      return;
    }
    var table = el('<table class="kaizen-table"><thead><tr><th>Date</th><th>Name</th><th>Author</th><th>Type</th><th></th></tr></thead><tbody></tbody></table>');
    var tbody = table.querySelector("tbody");
    state.kaizens.slice().sort(function(a,b){return a.date<b.date?1:-1;}).forEach(function(k){
      var row = el('<tr><td class="mono">'+escapeHtml(k.date||'')+'</td><td>'+escapeHtml(k.name)+'</td><td>'+escapeHtml(k.person_name)+'</td><td>'+escapeHtml(k.kaizen_type||'ONGOING')+'</td><td style="white-space:nowrap;"></td></tr>');
      var actions = row.querySelector("td:last-child");
      var editBtn = el('<button type="button" class="btn small" style="margin-right:6px;">Edit</button>');
      editBtn.addEventListener("click", function(){ loadKaizenIntoForm(k); });
      var delBtn = el('<button type="button" class="btn small danger" data-delkz="'+escapeAttr(k.id)+'">Delete</button>');
      delBtn.addEventListener("click", async function(){
        if(!confirm("Delete this Kaizen record?")) return;
        state.kaizens = state.kaizens.filter(function(x){return x.id!==k.id;});
        var ok = await saveKaizens();
        if(!ok){ alert("Could not save after delete. Storage may be full."); return; }
        if(f.editingId === k.id) resetForm();
        renderExisting();
      });
      actions.appendChild(editBtn);
      actions.appendChild(delBtn);
      tbody.appendChild(row);
    });
    existingWrap.appendChild(table);
  }
  renderExisting();
  panel.appendChild(existingWrap);

  async function mediaFromFile(file, isImage){
    if(!file) return null;
    if(isImage){
      try{
        if(typeof compressImageFile === "function"){
          return await compressImageFile(file, 1280, 0.72);
        }
      }catch(e){ console.warn("compress failed", e); }
      // Avoid profile-crop dialog used by fileToDataUrl
      return await fileToDataUrlRaw(file);
    }
    // video: raw data URL (warn size handled by caller)
    return await fileToDataUrlRaw(file);
  }

  setTimeout(function(){
    var kzDateEl = document.getElementById("kz-date");
    if(!kzDateEl) return;
    updateBenefitUI();
    kzDateEl.addEventListener("change", function(e){ f.date=e.target.value; });
    document.getElementById("kz-name").addEventListener("input", function(e){ f.name=e.target.value; });
    document.getElementById("kz-person").addEventListener("input", function(e){ f.person_name=e.target.value; });
    document.getElementById("kz-class").addEventListener("change", function(e){ f.person_class=e.target.value; });
    var kzTypeEl = document.getElementById("kz-type");
    if(kzTypeEl) kzTypeEl.addEventListener("change", function(e){ f.kaizen_type=e.target.value; });
    var deptEl = document.getElementById("kz-dept");
    var otherRow = document.getElementById("kz-dept-other-row");
    if(deptEl) deptEl.addEventListener("change", function(){
      if(otherRow) otherRow.style.display = deptEl.value==="other" ? "" : "none";
    });
    document.getElementById("kz-cats").addEventListener("change", function(){
      f.categories = Array.prototype.slice.call(document.querySelectorAll(".kz-cat-cb:checked")).map(function(cb){return cb.value;});
      f.category = primaryCategory();
      updateBenefitUI();
    });
    document.getElementById("kz-money").addEventListener("input", function(e){ f.money_in_bank=Math.max(0,parseFloat(e.target.value)||0); });

    saveBtn.addEventListener("click", async function(){
      saveBtn.disabled = true;
      msg.style.display = "none";
      try{
        // Read text from live textareas first
        beforeWrap.querySelectorAll("textarea[data-btxt]").forEach(function(ta){
          var ix = parseInt(ta.getAttribute("data-btxt"),10);
          if(f.before[ix]) f.before[ix].text = ta.value;
        });
        afterWrap.querySelectorAll("textarea[data-atxt]").forEach(function(ta){
          var ix = parseInt(ta.getAttribute("data-atxt"),10);
          if(f.after[ix]) f.after[ix].text = ta.value;
        });

        var bf=Array.prototype.slice.call(beforeWrap.querySelectorAll("input[data-bfile]"));
        for(var bi=0;bi<bf.length;bi++){
          if(bf[bi].files&&bf[bi].files[0]){
            var bfIdx = parseInt(bf[bi].getAttribute("data-bfile"),10);
            f.before[bfIdx].image = await mediaFromFile(bf[bi].files[0], true);
          }
        }
        var af=Array.prototype.slice.call(afterWrap.querySelectorAll("input[data-afile]"));
        for(var ai=0;ai<af.length;ai++){
          if(af[ai].files&&af[ai].files[0]){
            var afIdx = parseInt(af[ai].getAttribute("data-afile"),10);
            f.after[afIdx].image = await mediaFromFile(af[ai].files[0], true);
          }
        }

        var beforeVideoFile = document.getElementById("kz-before-video-file");
        if(beforeVideoFile && beforeVideoFile.files && beforeVideoFile.files[0]){
          if(beforeVideoFile.files[0].size > 4.5*1024*1024){
            if(!confirm("This before video is quite large and may fail to save. Continue anyway?")) { saveBtn.disabled=false; return; }
          }
          f.before_video = await mediaFromFile(beforeVideoFile.files[0], false);
        }
        var afterVideoFile = document.getElementById("kz-after-video-file");
        if(afterVideoFile && afterVideoFile.files && afterVideoFile.files[0]){
          if(afterVideoFile.files[0].size > 4.5*1024*1024){
            if(!confirm("This after video is quite large and may fail to save. Continue anyway?")) { saveBtn.disabled=false; return; }
          }
          f.after_video = await mediaFromFile(afterVideoFile.files[0], false);
        }

        f.date = (document.getElementById("kz-date")||{}).value || f.date;
        f.name = ((document.getElementById("kz-name")||{}).value || "").trim();
        f.person_name = ((document.getElementById("kz-person")||{}).value || "").trim();
        f.person_class = (document.getElementById("kz-class")||{}).value || f.person_class;
        f.kaizen_type = (document.getElementById("kz-type")||{}).value || f.kaizen_type || "ONGOING";
        f.money_in_bank = Math.max(0, parseFloat((document.getElementById("kz-money")||{}).value)||0);

        f.categories = Array.prototype.slice.call(document.querySelectorAll(".kz-cat-cb:checked")).map(function(cb){return cb.value;});
        if(!f.categories.length){ alert("Please select at least one benefit category."); saveBtn.disabled=false; return; }
        f.category = f.categories[0];
        f.benefit_values = f.benefit_values || {};
        document.querySelectorAll(".kz-benefit-inp").forEach(function(inp){
          f.benefit_values[inp.getAttribute("data-cat")] = inp.value;
        });
        f.benefit_value = f.benefit_values[f.category] != null ? f.benefit_values[f.category] : f.benefit_value;

        var deptSel = document.getElementById("kz-dept");
        var deptVal = deptSel ? deptSel.value : "";
        if(!deptVal){ alert("Please select a department."); saveBtn.disabled=false; return; }
        if(deptVal==="other"){
          var otherName = ((document.getElementById("kz-dept-other")||{}).value || "").trim();
          if(!otherName){ alert("Please enter the other department name."); saveBtn.disabled=false; return; }
          f.department_id = "other";
          f.department_name = otherName;
        } else {
          var parts = deptVal.split(":");
          f.department_id = deptVal;
          var list = parts[0]==="office" ? (state.config.officeDepartments||[]) : (state.config.departments||[]);
          var found = list.find(function(d){ return d.id===parts[1]; });
          f.department_name = found ? found.name : deptVal;
        }

        if(!f.name || !f.person_name){
          alert("Please enter at least a Kaizen name and the person's name.");
          saveBtn.disabled=false;
          return;
        }

        var record = {
          id: f.editingId || ("kz_"+Date.now()+"_"+Math.floor(Math.random()*1000)),
          date: f.date, name: f.name, person_name: f.person_name,
          person_class: f.person_class, kaizen_type: f.kaizen_type || "ONGOING",
          department_id: f.department_id || "",
          department_name: f.department_name || "",
          category: f.category, categories: f.categories.slice(),
          benefit_value: f.benefit_value,
          benefit_values: Object.assign({}, f.benefit_values||{}),
          money_in_bank: f.money_in_bank,
          before: f.before.filter(function(p){return (p.text&&p.text.trim())||p.image;}),
          after: f.after.filter(function(p){return (p.text&&p.text.trim())||p.image;}),
          before_video: f.before_video || "", after_video: f.after_video || ""
        };

        if(f.editingId){
          var idx = state.kaizens.findIndex(function(x){ return x.id === f.editingId; });
          if(idx >= 0) state.kaizens[idx] = record;
          else state.kaizens.push(record);
        } else {
          state.kaizens.push(record);
        }

        var ok = await saveKaizens();
        if(!ok){
          // roll back new insert if storage failed
          if(!f.editingId){
            state.kaizens = state.kaizens.filter(function(x){ return x.id !== record.id; });
          }
          msg.style.display="inline";
          msg.style.color="var(--red)";
          msg.textContent="Save failed — storage may be full (try smaller photos/videos).";
          saveBtn.disabled=false;
          return;
        }
        msg.style.color="var(--green)";
        msg.textContent = f.editingId ? "Kaizen updated." : "Kaizen saved.";
        msg.style.display="inline";
        setTimeout(function(){ render(); }, 700);
      }catch(err){
        console.error(err);
        alert("Could not save Kaizen: "+(err && err.message || err));
        saveBtn.disabled=false;
      }
    });
  },0);

  return panel;
}

function renderAdminAccounts(){

        renderList();
      });
      list.appendChild(row);
    });

  var newPass = el('<input type="text" placeholder="Password for this person" style="max-width:200px;">');

function renderAdminMyData(){
  var panel = el('<div class="admin-panel"></div>');
  panel.appendChild(el('<h3>My Data</h3>'));

  var ratingDays = Object.keys(state.ratings||{}).length;
  var officeRatingDays = Object.keys(state.officeRatings||{}).length;
  var wasteWeeks = Object.keys(state.waste||{}).length;
  var awarenessDays = Object.keys(state.awareness||{}).length;

  var list = el(''+
    '<ul class="kv-list">'+
      '<li><span>Days with Floor Ratings recorded</span><b>'+ratingDays+'</b></li>'+
      '<li><span>Days with Office Ratings recorded</span><b>'+officeRatingDays+'</b></li>'+
      '<li><span>Kaizens recorded (all time)</span><b>'+state.kaizens.length+'</b></li>'+
      '<li><span>5S Sharing posts</span><b>'+state.shares.length+'</b></li>'+
      '<li><span>Kaizen Sharing posts</span><b>'+state.kaizenShares.length+'</b></li>'+

      '<li><span>Days with 5S Awareness recorded</span><b>'+awarenessDays+'</b></li>'+

    '</ul>'
  );
