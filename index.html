  var actions = el('<div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center;"></div>');
  var saveAllBtn = el('<button class="btn primary" type="button">Save all data now</button>');
  var exportBtn = el('<button class="btn primary" type="button">Download Full Backup (JSON)</button>');
  var excelBtn = el('<button class="btn primary" type="button">Download Excel Sheet (.xls)</button>');
  var importLabel = el('<label class="btn" style="display:inline-flex;align-items:center;cursor:pointer;margin:0;">Restore from backup<input type="file" accept="application/json,.json" id="backup-import-file" style="display:none;"></label>');
  var statusMsg = el('<span class="save-msg" id="mydata-status" style="display:none;"></span>');
  actions.appendChild(saveAllBtn);
  actions.appendChild(exportBtn);
  actions.appendChild(excelBtn);
  actions.appendChild(importLabel);
  actions.appendChild(statusMsg);
  panel.appendChild(actions);

  function setStatus(text, isErr){
    statusMsg.style.display = "inline";
    statusMsg.style.color = isErr ? "var(--red)" : "var(--green)";
    statusMsg.textContent = text;
  }

  saveAllBtn.addEventListener("click", async function(){
    saveAllBtn.disabled = true;
    setStatus("Saving…", false);
    try{
      var result = await saveAllData();
      if(result.ok){
        setStatus("All data saved successfully.", false);
      } else {
        setStatus("Saved with "+result.failed.length+" issue(s). Check storage space if photos failed.", true);
        console.warn("saveAll issues", result.failed);
      }
    }catch(e){
      setStatus("Save failed: "+(e && e.message || e), true);
    }
    saveAllBtn.disabled = false;
  });


  function csvEscape(v){
    var s = (v==null?"":String(v));
    if(/[",\n\r]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
    return s;
  }
  function downloadExcelSheet(){
    var lines = [];
    lines.push("Section,Key,Field,Value");
    // Floor ratings
    Object.keys(state.ratings||{}).sort().forEach(function(date){
      var day = state.ratings[date]||{};
      Object.keys(day).forEach(function(deptId){
        var dep = (state.config.departments||[]).find(function(d){return d.id===deptId;});
        lines.push(["Floor Ratings", date, dep?dep.name:deptId, day[deptId]].map(csvEscape).join(","));
      });
    });
    // Office ratings
    Object.keys(state.officeRatings||{}).sort().forEach(function(date){
      var day = state.officeRatings[date]||{};
      Object.keys(day).forEach(function(deptId){
        var dep = (state.config.officeDepartments||[]).find(function(d){return d.id===deptId;});
        lines.push(["Office Ratings", date, dep?dep.name:deptId, day[deptId]].map(csvEscape).join(","));
      });
    });
    // Awareness
    Object.keys(state.awareness||{}).sort().forEach(function(date){
      var aw = state.awareness[date]||{};
      lines.push(["5S Awareness", date, "Staff made aware", aw.staff||0].map(csvEscape).join(","));
      lines.push(["5S Awareness", date, "GR made aware", aw.gr||0].map(csvEscape).join(","));
    });
    // Waste
    Object.keys(state.waste||{}).sort().forEach(function(week){
      var w = state.waste[week];
      if(typeof w === "object"){
        Object.keys(w).forEach(function(k){
          lines.push(["Total Waste", week, k, w[k]].map(csvEscape).join(","));
        });
      } else {
        lines.push(["Total Waste", week, "value", w].map(csvEscape).join(","));
      }
    });
    // Kaizens
    (state.kaizens||[]).forEach(function(k){
      lines.push(["Kaizen", k.date||"", k.name||"", (k.person_name||"")+" | "+(k.department_name||"")+" | "+(k.kaizen_type||"")+" | money:"+(k.money_in_bank||0)].map(csvEscape).join(","));
    });
    // Training (department champions + training %)
    (state.config.departments||[]).forEach(function(d){
      lines.push(["Floor Department", d.id, d.name, "Champion: "+(d.champion||"")+" | Training: "+(d.training!=null?d.training:"")].map(csvEscape).join(","));
    });
    (state.config.officeDepartments||[]).forEach(function(d){
      lines.push(["Office Department", d.id, d.name, "Champion: "+(d.champion||"")+" | Training: "+(d.training!=null?d.training:"")].map(csvEscape).join(","));
    });
    // Shares counts
    lines.push(["Summary", "counts", "5S Sharing posts", (state.shares||[]).length].map(csvEscape).join(","));
    lines.push(["Summary", "counts", "Kaizen Sharing posts", (state.kaizenShares||[]).length].map(csvEscape).join(","));
    lines.push(["Summary", "counts", "Improvements posts", (state.improvements||[]).length].map(csvEscape).join(","));
    lines.push(["Summary", "counts", "Beyond Boundaries posts", (state.beyondBoundaries||[]).length].map(csvEscape).join(","));
    lines.push(["Summary", "counts", "Best 5S Departments photos", (state.bestOfMonth||[]).length].map(csvEscape).join(","));
    lines.push(["Summary", "counts", "Video library items", (state.videoLibrary||[]).length].map(csvEscape).join(","));

    // Excel-compatible HTML table workbook (opens in Excel without external libs)
    var html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="UTF-8"><!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet><x:Name>5S Kaizen Data</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions></x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]--></head><body><table border="1">';
    lines.forEach(function(line, i){
      var cells = line.split(",");
      // rough split is ok for our csvEscape usage; rebuild from original arrays instead for reliability
      html += "<tr>";
      // re-parse safely: we stored csv lines; for HTML rebuild use simple split knowing we escaped
      var parts = [];
      var cur = "";
      var inQ = false;
      for(var ci=0;ci<line.length;ci++){
        var ch = line.charAt(ci);
        if(ch==='"'){
          if(inQ && line.charAt(ci+1)==='"'){ cur+='"'; ci++; }
          else inQ = !inQ;
        } else if(ch===',' && !inQ){ parts.push(cur); cur=""; }
        else cur += ch;
      }
      parts.push(cur);
      parts.forEach(function(p){ html += "<td>"+String(p).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")+"</td>"; });
      html += "</tr>";
    });
    html += "</table></body></html>";
    var blob = new Blob([html], {type:"application/vnd.ms-excel;charset=utf-8"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "5s-kaizen-data-"+state.currentFactory+"-"+todayStr()+".xls";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  excelBtn.addEventListener("click", function(){
    try{
      downloadExcelSheet();
      setStatus("Excel sheet downloaded.", false);
    }catch(e){
      setStatus("Excel export failed: "+(e && e.message || e), true);
    }
  });

  exportBtn.addEventListener("click", async function(){
    try{
      // refresh dept details into cache before export
      await saveAllData();
      var backup = buildFullBackupObject();
      var blob = new Blob([JSON.stringify(backup, null, 2)], {type:"application/json"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "5s-kaizen-backup-"+state.currentFactory+"-"+todayStr()+".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      setStatus("Backup downloaded.", false);
    }catch(e){
      setStatus("Backup failed: "+(e && e.message || e), true);
    }
  });

  var importInput = importLabel.querySelector("#backup-import-file");
  importInput.addEventListener("change", async function(){
    var file = importInput.files && importInput.files[0];
    if(!file) return;
    if(!confirm("Restore this backup into factory "+state.currentFactory+"? Current data for this factory will be overwritten.")){
      importInput.value = "";
      return;
    }
    try{
      var text = await file.text();
      var data = JSON.parse(text);
      setStatus("Restoring…", false);
      var result = await restoreFullBackupObject(data);
      setStatus(result.ok ? "Backup restored and saved." : "Restored with some save issues.", !result.ok);
      render();
    }catch(e){
      setStatus("Restore failed: "+(e && e.message || e), true);
    }
    importInput.value = "";
  });

  return panel;
}


/* ============================================================
   MY NOTES — task tableau (Daily / Weekly)
============================================================ */
function renderMyNotes(opts){
  opts = opts || {};
  if(!Array.isArray(state.myNotes)) state.myNotes = [];

  function flattenNotes(raw){
    var out = [];
    (raw||[]).forEach(function(n){
      if(!n) return;
      if(n.actionItems && Array.isArray(n.actionItems)){
        n.actionItems.forEach(function(a){
          if(!a) return;
          out.push({
            id: a.id || ("note_"+Math.random().toString(36).slice(2,9)),
            text: a.text || n.title || "",
            deadline: a.deadline || "",
            responsible: a.responsible || "",
            remarks: a.remarks || "",
            status: a.status || "not_started",
            createdAt: a.createdAt || n.createdAt || Date.now()
          });
        });
      } else if(n.task){
        out.push({
          id: n.id || ("note_"+Math.random().toString(36).slice(2,9)),
          text: n.task || "",
          deadline: n.deadline || "",
          responsible: n.responsible || "",
          remarks: n.remarks || "",
          status: n.status || "not_started",
          createdAt: n.createdAt || Date.now()
        });
      } else if(n.text != null || n.status){
        out.push({
          id: n.id || ("note_"+Math.random().toString(36).slice(2,9)),
          text: n.text || n.title || "",
          deadline: n.deadline || "",
          responsible: n.responsible || "",
          remarks: n.remarks || "",
          status: n.status || "not_started",
          createdAt: n.createdAt || Date.now()
        });
      }
    });
    return out;
  }

  if(state.myNotes.some(function(n){ return n && (n.actionItems || n.task || n.agenda != null); })){
    state.myNotes = flattenNotes(state.myNotes);
  }

  function todayStrLocal(){
    var d = new Date();
    var m = d.getMonth()+1, day = d.getDate();
    return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(day<10?"0":"")+day;
  }

  /** If deadline is before today and note is not Done, force Pending. */
  function applyOverdueRules(list){
    var today = todayStrLocal();
    (list||[]).forEach(function(n){
      if(!n || !n.deadline) return;
      if(statusOf(n) === "done") return;
      // deadline is YYYY-MM-DD from input type=date
      if(String(n.deadline) < today){
        n.status = "pending";
      }
    });
    return list;
  }

  applyOverdueRules(state.myNotes);

  var wrap = el('<div class="mynotes-page"></div>');
  wrap.appendChild(el('<div class="admin-panel" style="margin-bottom:12px;"><h3 style="margin:0 0 6px;">My Notes</h3></div>'));

  var toolbar = el('<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;"></div>');
  var addBtn = el('<button type="button" class="btn primary" id="mn-add-note">+ Add note</button>');
  var saveAllBtn = el('<button type="button" class="btn" id="mn-save-all">Save all notes</button>');
  var msg = el('<span class="save-msg" id="mn-msg" style="display:none;"></span>');
  toolbar.appendChild(addBtn);
  toolbar.appendChild(saveAllBtn);
  toolbar.appendChild(msg);
  wrap.appendChild(toolbar);

  var listHost = el('<div id="mn-note-list" class="mn-status-groups"></div>');
  wrap.appendChild(listHost);

  function uid(){ return "note_"+Date.now()+"_"+Math.floor(Math.random()*1000); }

  function statusOf(n){
    var s = (n && n.status) || "not_started";
    if(s === "not-started") s = "not_started";
    if(s!=="wip" && s!=="done" && s!=="pending" && s!=="not_started") s = "not_started";
    return s;
  }

  function noteLabel(index1){ return "Note "+index1; }

  function readAllFromDom(){
    var items = [];
    listHost.querySelectorAll(".mn-note-row").forEach(function(row){
      items.push({
        id: row.getAttribute("data-nid") || uid(),
        text: (row.querySelector("[data-f=text]")||{}).value || "",
        deadline: (row.querySelector("[data-f=deadline]")||{}).value || "",
        responsible: (row.querySelector("[data-f=responsible]")||{}).value || "",
        remarks: (row.querySelector("[data-f=remarks]")||{}).value || "",
        status: (row.querySelector("[data-f=status]")||{}).value || "not_started",
        createdAt: parseInt(row.getAttribute("data-created")||Date.now(),10) || Date.now()
      });
    });
    applyOverdueRules(items);
    return items;
  }

  function paint(){
    applyOverdueRules(state.myNotes);

    var ordered = (state.myNotes||[]).slice().sort(function(a,b){
      return (a.createdAt||0)-(b.createdAt||0) || String(a.id).localeCompare(String(b.id));
    });
    var numberMap = {};
    ordered.forEach(function(n,i){ numberMap[n.id] = i+1; });

    var groups = [
      {key:"not_started", title:"Not yet started", cls:"mn-group-not-started"},
      {key:"pending", title:"Pending", cls:"mn-group-pending"},
      {key:"wip", title:"WIP", cls:"mn-group-wip"},
      {key:"done", title:"Done", cls:"mn-group-done"}
    ];

    listHost.innerHTML = "";
    groups.forEach(function(g){
      var items = ordered.filter(function(n){ return statusOf(n)===g.key; });
      var section = el('<section class="mn-status-group '+g.cls+'"></section>');
      section.appendChild(el('<div class="mn-status-group-head"><span class="mn-status-dot"></span>'+g.title+' <span class="mn-status-count">'+items.length+'</span></div>'));
      var body = el('<div class="mn-status-group-body"></div>');
      if(!items.length){
        body.appendChild(el('<div class="mn-empty">No notes in this group.</div>'));
      } else {
        items.forEach(function(n){
          var num = numberMap[n.id] || 1;
          var st = statusOf(n);
          var overdue = n.deadline && String(n.deadline) < todayStrLocal() && st !== "done";
          var row = el('<div class="mn-note-row mn-note-'+st+(overdue?" mn-note-overdue":"")+'" data-nid="'+escapeAttr(n.id)+'" data-created="'+escapeAttr(String(n.createdAt||Date.now()))+'"></div>');
          row.innerHTML =
            '<div class="mn-note-label">'+escapeHtml(noteLabel(num))+(overdue?' <span class="mn-overdue-tag">Overdue</span>':'')+'</div>'+
            '<div class="mn-note-fields">'+
              '<input type="text" data-f="text" placeholder="Write your note…" value="'+escapeAttr(n.text||'')+'">'+
              '<input type="date" data-f="deadline" value="'+escapeAttr(n.deadline||'')+'" title="Deadline">'+
              '<input type="text" data-f="responsible" placeholder="Responsible" value="'+escapeAttr(n.responsible||'')+'">'+
              '<input type="text" data-f="remarks" placeholder="Remarks" value="'+escapeAttr(n.remarks||'')+'">'+
              '<select data-f="status">'+
                '<option value="not_started"'+(st==="not_started"?" selected":"")+'>Not yet started</option>'+
                '<option value="pending"'+(st==="pending"?" selected":"")+'>Pending</option>'+
                '<option value="wip"'+(st==="wip"?" selected":"")+'>WIP</option>'+
                '<option value="done"'+(st==="done"?" selected":"")+'>Done</option>'+
              '</select>'+
              '<button type="button" class="btn small danger" data-rm title="Delete">×</button>'+
            '</div>';
          body.appendChild(row);
        });
      }
      section.appendChild(body);
      listHost.appendChild(section);
    });

    listHost.querySelectorAll(".mn-note-row [data-f=status]").forEach(function(sel){
      sel.addEventListener("change", function(){
        state.myNotes = readAllFromDom();
        paint();
      });
    });
    listHost.querySelectorAll(".mn-note-row [data-f=deadline]").forEach(function(inp){
      inp.addEventListener("change", function(){
        state.myNotes = readAllFromDom();
        paint();
      });
    });
    listHost.querySelectorAll(".mn-note-row [data-rm]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var row = btn.closest(".mn-note-row");
        if(!row) return;
        var id = row.getAttribute("data-nid");
        state.myNotes = readAllFromDom().filter(function(x){ return x.id !== id; });
        paint();
      });
    });
  }

  addBtn.addEventListener("click", function(){
    state.myNotes = readAllFromDom();
    state.myNotes.push({
      id: uid(),
      text: "",
      deadline: "",
      responsible: "",
      remarks: "",
      status: "not_started",
      createdAt: Date.now()
    });
    paint();
    var first = listHost.querySelector(".mn-group-not-started .mn-note-row:last-child [data-f=text]");
    if(first) first.focus();
  });

  saveAllBtn.addEventListener("click", async function(){
    state.myNotes = readAllFromDom();
    await saveMyNotes();
    msg.style.display = "inline";
    msg.style.color = "var(--green)";
    msg.textContent = "All notes saved.";
    setTimeout(function(){ msg.style.display="none"; }, 1600);
    paint();
  });

  paint();
  return wrap;
}



/* ============================================================
   TOOLS LIBRARY (5S Manual, Kaizen Manual, etc.) — admin-managed, everyone can view
============================================================ */
var TOOL_TYPES = [
  ["pdf","PDF","\ud83d\udcc4"],["pptx","PowerPoint","\ud83d\udcca"],["word","Word","\ud83d\udcdd"],
  ["excel","Excel","\ud83d\udcc8"],["video","Video","\ud83c\udfac"],["mp3","MP3 Audio","\ud83c\udfb5"],
  ["canva","Canva Link","\ud83c\udfa8"],["other","Other","\ud83d\udcce"]
];
function toolTypeInfo(type){
  return TOOL_TYPES.find(function(t){return t[0]===type;}) || TOOL_TYPES[TOOL_TYPES.length-1];
}
function renderTools(){
  var VIDEO_CATEGORIES = [
    "5S Principle",
    "5S in the floor",
    "5S in Office",
    "Kaizen principle",
    "Innovation",
    "Benchmark"
  ];
  if(!Array.isArray(state.videoLibrary)) state.videoLibrary = [];

  function youtubeId(url){
    if(!url) return null;
    var m = String(url).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/))([A-Za-z0-9_-]{6,})/);
    return m ? m[1] : null;
  }
  function videoThumb(url){
    var id = youtubeId(url);
    if(id) return "https://img.youtube.com/vi/"+id+"/hqdefault.jpg";
    return null;
  }

  var wrap = el('<div></div>');
  wrap.appendChild(el('<div class="pagehead"><div><div class="eyebrow">Resource library</div><h2>Tools &amp; Library</h2></div></div>'));

  // ---- Video collections (horizontal per category) ----
  var vidLib = el('<div class="video-library"></div>');
  vidLib.appendChild(el('<h3>Video collections</h3>'));

  var vidHost = el('<div></div>');
  function renderVideoSections(){
    vidHost.innerHTML = "";
    var hasAny = (state.videoLibrary||[]).length > 0;
    VIDEO_CATEGORIES.forEach(function(cat){
      var items = (state.videoLibrary||[]).filter(function(v){ return v.category === cat; })
        .slice().sort(function(a,b){ return (b.createdAt||0) - (a.createdAt||0); });
      var section = el('<div class="video-cat" data-cat="'+escapeAttr(cat)+'"></div>');
      var head = el('<div class="video-cat-head"></div>');
      head.appendChild(el('<h4>'+escapeHtml(cat)+'<span class="video-cat-count">'+items.length+'</span></h4>'));
      var arrows = el('<div class="video-arrows"></div>');
      var leftBtn = el('<button type="button" aria-label="Scroll left">\u2039</button>');
      var rightBtn = el('<button type="button" aria-label="Scroll right">\u203A</button>');
      arrows.appendChild(leftBtn);
      arrows.appendChild(rightBtn);
      head.appendChild(arrows);
      section.appendChild(head);

      var rowWrap = el('<div class="video-row-wrap"></div>');
      var row = el('<div class="video-row"></div>');
      if(!items.length){
        row.appendChild(el('<div class="video-empty">No videos in this category yet.</div>'));
      } else {
        items.forEach(function(v){
          var customThumb = v.thumbnail || v.thumb || "";
          var thumb = customThumb || videoThumb(v.url);
          var isFile = !!(v.fileData || (v.url && String(v.url).indexOf("data:")===0));
          var mediaUrl = v.fileData || v.url || "";
          var card = el('<div class="video-card"></div>');
          var thumbEl = el('<div class="video-thumb"></div>');
          if(thumb){
            thumbEl.appendChild(el('<img src="'+escapeAttr(thumb)+'" alt="'+escapeAttr(v.title||"Video thumbnail")+'">'));
          } else if(isFile && mediaUrl){
            var vidPrev = el('<video src="'+escapeAttr(mediaUrl)+'" muted preload="metadata"></video>');
            thumbEl.appendChild(vidPrev);
          } else {
            thumbEl.style.background = "linear-gradient(135deg,#1e293b,#334155)";
          }
          thumbEl.appendChild(el('<div class="play-badge">\u25B6</div>'));
          card.appendChild(thumbEl);
          var body = el('<div class="video-card-body"></div>');
          body.appendChild(el('<div class="video-card-title">'+escapeHtml(v.title||"Untitled")+'</div>'));
          var actions = el('<div class="video-card-actions"></div>');
          // Cloud download icon (below title / under video)
          var dlCloud = el(
            '<button type="button" class="video-dl-cloud" title="Download">'+
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+
                '<path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/>'+
                '<polyline points="8 17 12 21 16 17"/>'+
                '<line x1="12" y1="12" x2="12" y2="21"/>'+
              '</svg>'+
            '</button>'
          );
          dlCloud.addEventListener("click", function(e){
            e.stopPropagation();
            if(!mediaUrl){ alert("No file available to download."); return; }
            try{
              var a = document.createElement("a");
              a.href = mediaUrl;
              a.download = (v.title||"video").replace(/[^\w\-]+/g,"_") + (String(mediaUrl).indexOf("data:video")===0 ? ".mp4" : "");
              a.rel = "noopener";
              document.body.appendChild(a);
              a.click();
              a.remove();
            }catch(err){
              // fallback: open in same page player if download blocked
              openVideoPlayer(mediaUrl, v.title||"Video");
            }
          });
          actions.appendChild(dlCloud);
          if(state.adminAuthed){
            var thumbBtn = el('<button type="button" class="btn small">Thumbnail</button>');
            thumbBtn.addEventListener("click", async function(e){
              e.stopPropagation();
              var item = (state.videoLibrary||[]).find(function(x){ return x.id === v.id; });
              if(!item) return;
              var id = youtubeId(item.url || "");
              if(id){
                var opts = [
                  "https://img.youtube.com/vi/"+id+"/maxresdefault.jpg",
                  "https://img.youtube.com/vi/"+id+"/sddefault.jpg",
                  "https://img.youtube.com/vi/"+id+"/hqdefault.jpg",
                  "https://img.youtube.com/vi/"+id+"/mqdefault.jpg",
                  "https://img.youtube.com/vi/"+id+"/default.jpg"
                ];
                var pick = prompt("Choose thumbnail 1-5 for this YouTube video:\n1 Max\n2 SD\n3 HQ\n4 MQ\n5 Default\n\nEnter 1-5:", "3");
                var n = parseInt(pick, 10);
                if(n>=1 && n<=5){
                  item.thumbnail = opts[n-1];
                  await saveVideoLibrary();
                  renderVideoSections();
                }
                return;
              }
              if(item.fileData || (item.url && String(item.url).indexOf("data:")===0)){
                alert("This video already has frame-based thumbnails from when it was added. Remove and re-add the file to pick a different frame, or leave the current thumbnail.");
                return;
              }
              alert("Thumbnail options are available for YouTube links and for videos uploaded as files (5 frames captured when adding).");
            });
            actions.appendChild(thumbBtn);
            var delBtn = el('<button type="button" class="btn small danger">Remove</button>');
            delBtn.addEventListener("click", async function(e){
              e.stopPropagation();
              if(!confirm('Remove video "'+(v.title||"")+'"?')) return;
              state.videoLibrary = (state.videoLibrary||[]).filter(function(x){ return x.id !== v.id; });
              await saveVideoLibrary();
              renderVideoSections();
            });
            actions.appendChild(delBtn);
          }
          body.appendChild(actions);
          card.appendChild(body);
          // Click thumbnail / card media → play on-screen (modal), not a new tab
          thumbEl.style.cursor = "pointer";
          thumbEl.addEventListener("click", function(e){
            e.preventDefault();
            e.stopPropagation();
            if(!mediaUrl){ alert("No video available."); return; }
            openVideoPlayer(mediaUrl, v.title||"Video");
          });
          row.appendChild(card);
        });
      }
      rowWrap.appendChild(row);
      section.appendChild(rowWrap);

      function updateArrows(){
        var maxScroll = Math.max(0, row.scrollWidth - row.clientWidth);
        leftBtn.disabled = row.scrollLeft <= 4;
        rightBtn.disabled = row.scrollLeft >= maxScroll - 4;
      }
      leftBtn.addEventListener("click", function(){
        row.scrollBy({ left: -Math.max(200, row.clientWidth * 0.8), behavior: "smooth" });
      });
      rightBtn.addEventListener("click", function(){
        row.scrollBy({ left: Math.max(200, row.clientWidth * 0.8), behavior: "smooth" });
      });
      row.addEventListener("scroll", updateArrows, { passive: true });
      setTimeout(updateArrows, 50);
      vidHost.appendChild(section);
    });
    if(!hasAny){
      // still show category shells above
    }
  }
  renderVideoSections();
  vidLib.appendChild(vidHost);
  wrap.appendChild(vidLib);

  // ---- Tools / documents list ----
  var listHost = el('<div style="margin-top:8px;"></div>');
  listHost.appendChild(el('<h3 style="font-family:var(--font-display);font-size:18px;font-weight:700;margin:18px 0 10px;">Tools &amp; documents</h3>'));
  function renderList(){
    // keep heading
    var heading = listHost.querySelector("h3");
    listHost.innerHTML = "";
    if(heading) listHost.appendChild(heading);
    else listHost.appendChild(el('<h3 style="font-family:var(--font-display);font-size:18px;font-weight:700;margin:18px 0 10px;">Tools &amp; documents</h3>'));
    if(!state.tools.length){
      listHost.appendChild(el('<div class="empty-state"><div class="big">\u2014</div>No tools or documents have been added yet.</div>'));
      return;
    }
    var grid = el('<div class="tools-grid"></div>');
    state.tools.slice().sort(function(a,b){return b.createdAt-a.createdAt;}).forEach(function(t){
      var info = toolTypeInfo(t.type);
      var card = el(''+
        '<div class="tool-card">'+
          '<div class="tool-icon">'+info[2]+'</div>'+
          '<div class="tool-type">'+info[1]+'</div>'+
          '<div class="tool-title">'+escapeHtml(t.title)+'</div>'+
          (t.description ? '<div class="tool-desc">'+escapeHtml(t.description)+'</div>' : '')+
          '<button type="button" class="btn primary tool-open">Open</button>'+
        '</div>'
      );
      var openBtn = card.querySelector('.tool-open');
      if(openBtn){
        openBtn.addEventListener('click', function(e){
          e.preventDefault();
          e.stopPropagation();
          openInAppViewer(t.fileData || t.url || '', t.title || 'Document', t.type || '');
        });
      }
      if(state.adminAuthed){
        var delBtn = el('<button class="btn small danger" style="margin-top:2px;">Remove</button>');
        delBtn.addEventListener("click", async function(){
          if(!confirm('Remove "'+t.title+'" from Tools?')) return;
          state.tools = state.tools.filter(function(x){return x.id!==t.id;});
          await saveTools();
          renderList();
        });
        card.appendChild(delBtn);
      }
      grid.appendChild(card);
    });
    listHost.appendChild(grid);
  }
  renderList();
  wrap.appendChild(listHost);

  if(state.adminAuthed){
    var adminSplit = el('<div class="admin-add-split"></div>');

    // Add Tool / Document (left)
    var addPanel = el('<div class="admin-panel"></div>');
    addPanel.appendChild(el('<h3>Add a Tool / Document</h3>'));
    var typeOpts = TOOL_TYPES.map(function(t){return '<option value="'+t[0]+'">'+t[2]+' '+t[1]+'</option>';}).join("");
    addPanel.appendChild(el('<div class="field-row"><label>Title</label><input type="text" id="tool-title" placeholder="e.g. 5S Manual"></div>'));
    addPanel.appendChild(el('<div class="field-row"><label>Type</label><select id="tool-type">'+typeOpts+'</select></div>'));
    addPanel.appendChild(el('<div class="field-row"><label>Link / URL</label><input type="text" id="tool-url" placeholder="https://… (optional if uploading a file)"></div>'));
    addPanel.appendChild(el('<div class="field-row"><label>Or choose file</label><input type="file" id="tool-file" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.csv,.mp3,.mp4,.webm,.png,.jpg,.jpeg,.gif,.webp,application/pdf,image/*,audio/*,video/*,.txt"></div>'));
    addPanel.appendChild(el('<div class="field-row"><label>Description</label><input type="text" id="tool-desc" placeholder="Optional short description"></div>'));
    var addBtn = el('<button class="btn primary">Add to Tools</button>');
    var addMsg = el('<span class="save-msg" style="display:none;">Added.</span>');
    var btnRow = el('<div></div>'); btnRow.appendChild(addBtn); btnRow.appendChild(addMsg);
    addPanel.appendChild(btnRow);

    addBtn.addEventListener("click", async function(){
      var title = document.getElementById("tool-title").value.trim();
      var type = document.getElementById("tool-type").value;
      var url = document.getElementById("tool-url").value.trim();
      var desc = document.getElementById("tool-desc").value.trim();
      var fileInp = document.getElementById("tool-file");
      var file = fileInp && fileInp.files && fileInp.files[0] ? fileInp.files[0] : null;
      if(!title){ alert("Please enter a title."); return; }
      if(!url && !file){ alert("Please paste a link or choose a file from your device."); return; }
      var fileData = "";
      var fileName = "";
      if(file){
        if(file.size > 8*1024*1024){
          if(!confirm("This file is larger than 8 MB and may fail to save in browser storage. Continue anyway?")) return;
        }
        try{
          fileData = await fileToDataUrlRaw(file);
          fileName = file.name || "";
          var lower = (fileName || "").toLowerCase();
          if(type === "other" || !type){
            if(/\.pdf$/.test(lower)) type = "pdf";
            else if(/\.pptx?$/.test(lower)) type = "pptx";
            else if(/\.docx?$/.test(lower)) type = "word";
            else if(/\.xlsx?$|\.csv$/.test(lower)) type = "excel";
            else if(/\.mp4$|\.webm$|\.mov$/.test(lower)) type = "video";
            else if(/\.mp3$|\.wav$|\.m4a$/.test(lower)) type = "mp3";
          }
        }catch(err){
          alert("Could not read file: "+(err && err.message || err));
          return;
        }
      }
      state.tools.push({
        id:"tool_"+Date.now(),
        title:title,
        type:type,
        url: url || fileData,
        fileData: fileData || "",
        fileName: fileName,
        description:desc,
        createdAt:Date.now()
      });
      await saveTools();
      document.getElementById("tool-title").value="";
      document.getElementById("tool-url").value="";
      document.getElementById("tool-desc").value="";
      if(fileInp) fileInp.value="";
      addMsg.style.display="inline";
      setTimeout(function(){ addMsg.style.display="none"; },1800);
      renderList();
    });
    adminSplit.appendChild(addPanel);

    // Add Video to collection
    var vidPanel = el('<div class="admin-panel"></div>');
    vidPanel.appendChild(el('<h3>Add a Video to collection</h3>'));
    vidPanel.appendChild(el('<div class="field-row"><label>Video title</label><input type="text" id="vid-title" placeholder="e.g. How to apply Seiri on the line"></div>'));
    var catOpts = VIDEO_CATEGORIES.map(function(c){ return '<option value="'+escapeAttr(c)+'">'+escapeHtml(c)+'</option>'; }).join("");
    vidPanel.appendChild(el('<div class="field-row"><label>Category</label><select id="vid-category">'+catOpts+'</select></div>'));
    vidPanel.appendChild(el('<div class="field-row"><label>Video link / URL</label><input type="text" id="vid-url" placeholder="https://youtube.com/\u2026 or company server URL (optional if uploading a file)"></div>'));
    vidPanel.appendChild(el('<div class="field-row"><label>Or choose file from device</label><input type="file" id="vid-file" accept="video/*"></div>'));
    var thumbPick = el('<div id="vid-thumb-picker" class="vid-thumb-picker" style="display:none;margin:12px 0 4px;">'+
      '<div style="font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:8px;font-weight:700;">Choose thumbnail (5 options from this video)</div>'+
      '<div id="vid-thumb-options" class="vid-thumb-options"></div>'+
      '<div id="vid-thumb-status" class="note" style="margin-top:8px;display:none;"></div>'+
    '</div>');
    vidPanel.appendChild(thumbPick);
    var vidBtn = el('<button class="btn primary">Add Video</button>');
    var vidMsg = el('<span class="save-msg" style="display:none;">Video added.</span>');
    var vidBtnRow = el('<div></div>'); vidBtnRow.appendChild(vidBtn); vidBtnRow.appendChild(vidMsg);
    vidPanel.appendChild(vidBtnRow);

    var selectedThumb = "";

    function setThumbStatus(msg, isErr){
      var st = document.getElementById("vid-thumb-status");
      if(!st) return;
      if(!msg){ st.style.display="none"; st.textContent=""; return; }
      st.style.display="block";
      st.style.color = isErr ? "var(--red)" : "var(--ink-soft)";
      st.textContent = msg;
    }

    function renderThumbOptions(urls){
      var host = document.getElementById("vid-thumb-options");
      var picker = document.getElementById("vid-thumb-picker");
      if(!host || !picker) return;
      host.innerHTML = "";
      selectedThumb = "";
      if(!urls || !urls.length){
        picker.style.display = "none";
        return;
      }
      picker.style.display = "block";
      urls.forEach(function(src, idx){
        var card = el('<button type="button" class="vid-thumb-opt" data-idx="'+idx+'" title="Use this frame as thumbnail"></button>');
        var img = el('<img alt="Thumbnail option '+(idx+1)+'">');
        img.src = src;
        img.onerror = function(){ card.style.opacity = "0.35"; card.disabled = true; };
        card.appendChild(img);
        var label = el('<span>Option '+(idx+1)+'</span>');
        card.appendChild(label);
        card.addEventListener("click", function(){
          selectedThumb = src;
          host.querySelectorAll(".vid-thumb-opt").forEach(function(b){ b.classList.remove("selected"); });
          card.classList.add("selected");
          setThumbStatus("Thumbnail option "+(idx+1)+" selected.");
        });
        host.appendChild(card);
      });
      // auto-select first working option
      selectedThumb = urls[0];
      var first = host.querySelector(".vid-thumb-opt");
      if(first) first.classList.add("selected");
      setThumbStatus("Click one of the 5 frames to set the video card thumbnail.");
    }

    function youtubeThumbCandidates(url){
      var id = youtubeId(url);
      if(!id) return [];
      // 5 official YouTube stills
      return [
        "https://img.youtube.com/vi/"+id+"/maxresdefault.jpg",
        "https://img.youtube.com/vi/"+id+"/sddefault.jpg",
        "https://img.youtube.com/vi/"+id+"/hqdefault.jpg",
        "https://img.youtube.com/vi/"+id+"/mqdefault.jpg",
        "https://img.youtube.com/vi/"+id+"/default.jpg"
      ];
    }

    function captureFramesFromVideoFile(file){
      return new Promise(function(resolve, reject){
        var objectUrl = URL.createObjectURL(file);
        var video = document.createElement("video");
        video.preload = "auto";
        video.muted = true;
        video.playsInline = true;
        video.src = objectUrl;
        var frames = [];
        var cleaned = false;
        function cleanup(){
          if(cleaned) return;
          cleaned = true;
          try{ URL.revokeObjectURL(objectUrl); }catch(e){}
          video.removeAttribute("src");
          try{ video.load(); }catch(e){}
        }
        video.onerror = function(){
          cleanup();
          reject(new Error("Could not load this video for thumbnails."));
        };
        video.onloadedmetadata = function(){
          var duration = video.duration;
          if(!isFinite(duration) || duration <= 0){
            cleanup();
            reject(new Error("Could not read video duration."));
            return;
          }
          // 5 timestamps across the video (skip very start/end a little)
          var times = [];
          for(var i=0;i<5;i++){
            var t = duration * (0.12 + i * 0.18);
            if(t >= duration) t = Math.max(0, duration - 0.05);
            times.push(t);
          }
          var canvas = document.createElement("canvas");
          var ctx = canvas.getContext("2d");
          var ti = 0;
          function grabNext(){
            if(ti >= times.length){
              cleanup();
              resolve(frames);
              return;
            }
            var seekTo = times[ti++];
            var onSeek = function(){
              video.removeEventListener("seeked", onSeek);
              try{
                var w = video.videoWidth || 320;
                var h = video.videoHeight || 180;
                // limit size for storage
                var maxW = 480;
                if(w > maxW){ h = Math.round(h * (maxW / w)); w = maxW; }
                canvas.width = w;
                canvas.height = h;
                ctx.drawImage(video, 0, 0, w, h);
                frames.push(canvas.toDataURL("image/jpeg", 0.82));
              }catch(err){
                // skip failed frame
              }
              grabNext();
            };
            video.addEventListener("seeked", onSeek);
            try{
              video.currentTime = seekTo;
            }catch(err){
              video.removeEventListener("seeked", onSeek);
              grabNext();
            }
          }
          grabNext();
        };
      });
    }

    setTimeout(function(){
      var urlInp = document.getElementById("vid-url");
      var fileInp = document.getElementById("vid-file");
      var urlTimer = null;
      if(urlInp){
        urlInp.addEventListener("input", function(){
          clearTimeout(urlTimer);
          urlTimer = setTimeout(function(){
            var u = urlInp.value.trim();
            if(!u){
              if(!(fileInp && fileInp.files && fileInp.files[0])) renderThumbOptions([]);
              return;
            }
            var cands = youtubeThumbCandidates(u);
            if(cands.length){
              renderThumbOptions(cands);
            } else {
              // non-YouTube URL: no auto frames; leave empty
              if(!(fileInp && fileInp.files && fileInp.files[0])){
                renderThumbOptions([]);
                setThumbStatus("For non-YouTube links, upload the video file to generate 5 frame options.", false);
                var picker = document.getElementById("vid-thumb-picker");
                if(picker) picker.style.display = "block";
              }
            }
          }, 350);
        });
      }
      if(fileInp){
        fileInp.addEventListener("change", async function(){
          var f = fileInp.files && fileInp.files[0];
          if(!f){
            var u = (urlInp && urlInp.value.trim()) || "";
            var cands = youtubeThumbCandidates(u);
            renderThumbOptions(cands);
            return;
          }
          setThumbStatus("Capturing 5 frames from your video\u2026");
          var picker = document.getElementById("vid-thumb-picker");
          if(picker) picker.style.display = "block";
          try{
            var frames = await captureFramesFromVideoFile(f);
            if(!frames.length){
              renderThumbOptions([]);
              setThumbStatus("Could not capture frames from this video.", true);
              return;
            }
            renderThumbOptions(frames);
          }catch(err){
            renderThumbOptions([]);
            setThumbStatus("Thumbnail capture failed: "+(err && err.message || err), true);
          }
        });
      }
    },0);

    vidBtn.addEventListener("click", async function(){
      var title = document.getElementById("vid-title").value.trim();
      var category = document.getElementById("vid-category").value;
      var url = document.getElementById("vid-url").value.trim();
      var fileInp = document.getElementById("vid-file");
      var file = fileInp && fileInp.files && fileInp.files[0] ? fileInp.files[0] : null;
      if(!title){ alert("Please enter a video title."); return; }
      if(!url && !file){ alert("Please paste a video link or choose a file from your device."); return; }
      if(!VIDEO_CATEGORIES.includes(category)){ alert("Please choose a valid category."); return; }
      var fileData = "";
      if(file){
        if(file.size > 12*1024*1024){
          if(!confirm("This video is larger than 12 MB and may fail to save in browser storage. Continue anyway?")) return;
        }
        try{
          fileData = await fileToDataUrlRaw(file);
        }catch(err){
          alert("Could not read video file: "+(err && err.message || err));
          return;
        }
      }
      var thumbnail = selectedThumb || "";
      if(!thumbnail && url){
        var auto = youtubeThumbCandidates(url);
        if(auto.length) thumbnail = auto[2] || auto[0]; // prefer hqdefault
      }
      state.videoLibrary = state.videoLibrary || [];
      state.videoLibrary.push({
        id: "vid_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),
        title: title,
        category: category,
        url: url || fileData,
        fileData: fileData || "",
        fileName: file ? file.name : "",
        thumbnail: thumbnail,
        createdAt: Date.now()
      });
      await saveVideoLibrary();
      document.getElementById("vid-title").value = "";
      document.getElementById("vid-url").value = "";
      if(fileInp) fileInp.value = "";
      selectedThumb = "";
      renderThumbOptions([]);
      setThumbStatus("");
      vidMsg.style.display = "inline";
      setTimeout(function(){ vidMsg.style.display="none"; }, 1800);
      renderVideoSections();
    });
    adminSplit.appendChild(vidPanel);
    wrap.appendChild(adminSplit);
  }

  return wrap;
}

   BOOT
============================================================ */
function ensureMobileInputSafe(){
  try{
    document.querySelectorAll('.loading-veil, .veil, .overlay-block').forEach(function(n){
      if(!n.classList.contains('show') && !n.classList.contains('active')){
        n.style.pointerEvents = 'none';
      }
    });
    document.querySelectorAll('input, select, textarea, button').forEach(function(el){
      if(el.disabled) return;
      el.style.pointerEvents = 'auto';
    });
  }catch(e){}
}
/* mobile-input-safe */
async function boot(){
  render(); // shows loading veil
  await loadAll();
  render();
  ensureMobileInputSafe();
  setTimeout(ensureMobileInputSafe, 300);
}
boot();

})();
</script>
